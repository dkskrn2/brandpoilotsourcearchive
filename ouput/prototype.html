<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent v8 - Memory + Funnel + Triggers</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      --ink: #1f2937;
      --ink-subtle: #667085;
      --ink-soft: #98a2b3;
      --line: #e4e7ec;
      --surface: #ffffff;
      --surface-subtle: #fcfaf7;
      --accent: #8b6a3f;
      --accent-strong: #6f532f;
      --accent-soft: #ede6db;
      --bot-bubble: #f8f4ed;
      --user-bubble: #1f2937;
      --bg-app: #d6dae2;
      --home-gradient: linear-gradient(152deg, #f8f7f4 0%, #ece8e1 58%, #e8ebf1 100%);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --shadow-soft: 0 10px 30px rgba(16, 24, 40, 0.08);
      --ring-focus: 0 0 0 3px rgba(139, 106, 63, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Manrope', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-app);
      margin: 0;
      padding: 12px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--ink);
    }

    button,
    input {
      font-family: inherit;
    }

    .device {
      --home-input-top: 212px;
      width: min(375px, 100%);
      height: min(812px, calc(100dvh - 24px));
      background: var(--home-gradient);
      border-radius: 40px;
      box-shadow: 0 24px 60px rgba(16, 24, 40, 0.2);
      overflow: hidden;
      position: relative;
      border: 8px solid #fff;
      display: flex;
      flex-direction: column;
      transition: background 0.45s ease;
      margin: auto;
    }

    .device.chat-mode {
      background: #f5f6f8;
    }

    .header {
      padding: 18px 18px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 25;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .device.chat-mode .header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .header-left {
      width: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .back-btn {
      width: 28px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-size: 15px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: translateX(-6px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .device.chat-mode .back-btn {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .profile-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      margin: 0 10px;
      min-width: 0;
    }

    .avatar,
    .avatar-small {
      background: var(--surface);
      border: 1px dashed #c9bda9;
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .avatar {
      width: 40px;
      height: 40px;
    }

    .avatar-small {
      width: 30px;
      height: 30px;
    }

    .avatar::before,
    .avatar-small::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid #d9cfbf;
      border-radius: 50%;
    }

    .name-area {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .name {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.01em;
      white-space: nowrap;
      min-width: 0;
    }

    .name-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      font-size: 11px;
      color: var(--ink-subtle);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2f9e67;
      display: inline-block;
    }

    .stage-pill {
      font-size: 9px;
      font-weight: 800;
      color: var(--accent-strong);
      border: 1px solid #d8ccb8;
      background: #f7f2e9;
      border-radius: 999px;
      padding: 1px 6px;
      line-height: 1.4;
      max-width: 74px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions {
      display: none;
      gap: 6px;
      flex-shrink: 0;
    }

    .device.chat-mode .header-actions {
      display: flex;
    }

    .icon-btn {
      min-width: 38px;
      height: 30px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-mark {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      border: 1px solid #cdbfa8;
      background: #f7f2e8;
      display: inline-block;
      flex-shrink: 0;
    }

    .home-content {
      position: absolute;
      top: 80px;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 26px 20px;
      padding-bottom: 24px;
      z-index: 5;
      overflow-y: auto;
      transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: top center;
    }

    .home-content::-webkit-scrollbar {
      display: none;
    }

    .device.chat-mode .home-content {
      opacity: 0;
      transform: translateY(-30px) scale(0.98);
      pointer-events: none;
    }

    .home-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--ink);
      font-weight: 800;
    }

    .home-subtitle {
      margin: 8px 0 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--ink-subtle);
      white-space: pre-line;
    }

    .home-primary-cta {
      margin-top: 16px;
      width: 100%;
      min-height: 44px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--accent-strong);
      background: var(--accent-strong);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .search-placeholder {
      margin-top: 12px;
      border: none;
      background: transparent;
      padding: 0;
      font-size: 12px;
      line-height: 1.5;
      color: #5f6878;
    }

    .home-input-gap {
      height: 74px;
      pointer-events: none;
    }

    .section-title {
      margin: 10px 0 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink-subtle);
      text-transform: none;
      letter-spacing: 0.01em;
    }

    .category-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .category-card {
      width: 100%;
      border: 1px solid #d6deea;
      background: rgba(255, 255, 255, 0.82);
      border-radius: 14px;
      padding: 13px 14px;
      text-align: left;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease, border-color 0.14s ease;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 7px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }

    .category-card:hover {
      background: #ffffff;
      border-color: #c5d1e4;
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
    }

    .category-card:active {
      background: #f5f8fd;
      transform: translateY(0);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.06);
    }

    .category-image {
      display: none;
    }

    .cat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .cat-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.01em;
      word-break: keep-all;
    }

    .cat-arrow {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid #cfd8e7;
      background: #f8fafd;
      color: #4b5563;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.14s ease, background 0.14s ease, border-color 0.14s ease;
    }

    .category-card:hover .cat-arrow {
      transform: translateX(1px);
      border-color: #b9c8df;
      background: #eef3fb;
    }

    .cat-desc {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      color: var(--ink-subtle);
      word-break: keep-all;
    }

    .chat-content {
      position: absolute;
      top: 78px;
      bottom: 76px;
      left: 0;
      right: 0;
      padding: 16px 14px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: all 0.4s ease;
      scroll-behavior: smooth;
    }

    .device.chat-mode .chat-content {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .msg-row {
      display: block;
      animation: fadeIn 0.2s ease-in-out;
    }

    .msg-row+.msg-row {
      margin-top: 4px;
    }

    .msg-block {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .msg-role {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8a6f4f;
    }

    .msg-row.user .msg-role {
      color: #5c6474;
    }

    .bubble {
      max-width: 100%;
      padding: 0 0 0 10px;
      border-radius: 0;
      font-size: 14px;
      line-height: 1.66;
      white-space: pre-wrap;
      box-shadow: none;
      word-break: keep-all;
      background: transparent;
      border: none;
      color: var(--ink);
      border-left: 2px solid #dccfb9;
    }

    .msg-row.user .bubble {
      color: #111827;
      border-left-color: #cfd6e2;
    }

    .quick-replies {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-left: 0;
      margin-top: 4px;
      max-width: 100%;
    }

    .qr-btn {
      width: 100%;
      min-height: 40px;
      border-radius: 10px;
      border: 1px solid #d8dce5;
      background: #fff;
      color: #1f2937;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 650;
      line-height: 1.35;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      word-break: keep-all;
    }

    .qr-btn::before {
      content: "→ ";
      color: #667085;
      font-weight: 700;
    }

    .qr-btn.is-primary {
      background: #f8fafc;
      border-color: #cfd7e3;
      color: #111827;
    }

    .card-container {
      padding-left: 0;
      margin-top: 4px;
      max-width: 100%;
    }

    .card {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0 0 0 10px;
      box-shadow: none;
      overflow: visible;
      border-left: 2px solid #dccfb9;
    }

    .msg-row.bot .avatar-small {
      display: none;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .chip {
      font-size: 11px;
      font-weight: 700;
      color: #4b5563;
      border: 1px solid #e5ded2;
      background: #fcfaf7;
      border-radius: 999px;
      padding: 4px 8px;
    }

    .profile-overview {
      margin-top: 2px;
    }

    .profile-overview-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .profile-overview-title {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      color: #111827;
      letter-spacing: -0.01em;
    }

    .profile-overview-sub {
      margin: 3px 0 0;
      font-size: 11px;
      color: #6b7280;
      line-height: 1.35;
    }

    .profile-overview-score {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 800;
      color: #6f532f;
      border: 1px solid #dccfb9;
      background: #f7efe2;
      border-radius: 999px;
      padding: 4px 9px;
      line-height: 1;
    }

    .profile-overview-grid {
      margin: 11px 0 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .profile-overview-item {
      border: none;
      border-left: 2px solid #d4c5af;
      border-radius: 0;
      background: transparent;
      padding: 0 0 0 10px;
      min-height: 0;
    }

    .profile-overview-item dt {
      margin: 0;
      font-size: 10px;
      color: #7c6f5d;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .profile-overview-item dd {
      margin: 5px 0 0;
      font-size: 12px;
      color: #1f2937;
      line-height: 1.35;
      font-weight: 800;
      word-break: keep-all;
    }

    .profile-overview-note {
      margin: 10px 0 0;
      font-size: 11px;
      color: #475467;
      line-height: 1.45;
    }

    @media (max-width: 360px) {
      .profile-overview-grid {
        grid-template-columns: 1fr;
      }
    }

    .review-carousel {
      margin-top: 10px;
      position: relative;
      padding: 0 26px;
    }

    .review-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 4px;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      overscroll-behavior-x: contain;
    }

    .review-list::-webkit-scrollbar {
      display: none;
    }

    .review-item {
      display: flex;
      gap: 10px;
      border: 1px solid #ece5d8;
      border-radius: 12px;
      background: #fcfaf7;
      padding: 10px;
      min-width: 100%;
      max-width: 100%;
      flex: 0 0 100%;
      scroll-snap-align: start;
    }

    .review-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid #d8ccb8;
      background: #fff;
      color: #6f532f;
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      box-shadow: 0 4px 10px rgba(16, 24, 40, 0.12);
    }

    .review-nav.prev {
      left: 0;
    }

    .review-nav.next {
      right: 0;
    }

    .review-nav:disabled {
      opacity: 0.35;
      cursor: default;
      box-shadow: none;
    }

    .review-dots {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .review-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      border: none;
      background: #d4c9b7;
      padding: 0;
      cursor: pointer;
    }

    .review-dot.is-active {
      background: #6f532f;
      width: 16px;
    }

    .review-photo {
      width: 76px;
      height: 76px;
      border-radius: 10px;
      border: 1px solid #e5dbc9;
      background: #f7f2e8;
      padding: 6px;
      flex-shrink: 0;
    }

    .review-content {
      min-width: 0;
      flex: 1;
    }

    .review-text {
      margin: 0;
      font-size: 12px;
      line-height: 1.45;
      color: #344054;
      font-weight: 700;
      word-break: keep-all;
    }

    .review-author {
      margin: 8px 0 0;
      font-size: 11px;
      color: #1f2937;
      font-weight: 800;
    }

    .review-meta {
      margin: 3px 0 0;
      font-size: 11px;
      line-height: 1.35;
      color: #667085;
      word-break: keep-all;
    }

    .review-tags {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .review-tag {
      font-size: 10px;
      font-weight: 800;
      color: #6f532f;
      border: 1px solid #d9ccb8;
      background: #f8f2e7;
      border-radius: 999px;
      padding: 4px 8px;
      line-height: 1;
    }

    .merged-product-head {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .merged-product-photo {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      border: 1px solid #e5dbc9;
      background: #f7f2e8;
      padding: 6px;
      flex-shrink: 0;
    }

    .merged-product-info {
      min-width: 0;
      flex: 1;
    }

    .merged-rank {
      margin: 0;
      font-size: 11px;
      font-weight: 800;
      color: #6f532f;
    }

    .merged-name {
      margin: 4px 0 0;
      font-size: 14px;
      font-weight: 800;
      color: #1f2937;
      letter-spacing: -0.01em;
      word-break: keep-all;
    }

    .merged-meta {
      margin: 5px 0 0;
      font-size: 11px;
      line-height: 1.4;
      color: #667085;
      word-break: keep-all;
    }

    .merged-reason {
      margin: 8px 0 0;
      font-size: 11px;
      line-height: 1.45;
      color: #344054;
      word-break: keep-all;
    }

    .curation-panel {
      padding: 14px;
      border-radius: 16px;
      border: 1px solid #ddd3c3;
      background: linear-gradient(180deg, #fffdfa 0%, #f8f5ef 100%);
    }

    .curation-title {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      color: #1f2937;
      letter-spacing: -0.01em;
    }

    .curation-subtitle {
      margin: 5px 0 0;
      font-size: 11px;
      color: #667085;
      line-height: 1.45;
    }

    .curation-section {
      margin-top: 12px;
    }

    .curation-label {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 800;
      color: #344054;
    }

    .curation-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .curation-option {
      min-height: 34px;
      border: 1px solid #d8ccbb;
      background: #fff;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 700;
      color: #344054;
      cursor: pointer;
      line-height: 1.1;
      transition: all 0.15s ease;
    }

    .curation-option.is-selected {
      border-color: #6f532f;
      background: #6f532f;
      color: #fff;
      box-shadow: 0 3px 10px rgba(111, 83, 47, 0.25);
    }

    .curation-submit {
      margin-top: 14px;
      width: 100%;
      min-height: 42px;
      border-radius: 12px;
      border: 1px solid #6f532f;
      background: #6f532f;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .curation-submit:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .compare-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 12px;
      border-radius: 10px;
      overflow: hidden;
    }

    .compare-table th {
      background: #f4efe7;
      color: #3d3d3d;
      font-weight: 800;
      padding: 10px;
      border-bottom: 1px solid #e8e1d6;
    }

    .compare-table td {
      padding: 10px;
      border-top: 1px solid #ede8e0;
      line-height: 1.4;
      color: #344054;
    }

    .highlight {
      background: #fcf8f2;
      color: #614826;
      font-weight: 800;
    }

    .delivery-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .delivery-title {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      color: var(--ink);
    }

    .delivery-sub {
      margin-top: 3px;
      font-size: 11px;
      color: var(--ink-subtle);
    }

    .delivery-eta {
      font-size: 13px;
      font-weight: 800;
      color: #1f2937;
      white-space: nowrap;
    }

    .delivery-meta {
      margin: 0;
      font-size: 11px;
      color: #4b5563;
      line-height: 1.5;
    }

    .delivery-steps {
      margin-top: 12px;
      display: grid;

  <script>
    /* ======================================================

    /* -------------------- Storage helpers -------------------- */

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) { return null; }
    }
    function saveState(state) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { }
    }

    /* -------------------- Mock: user data exists -------------------- */
    const mockUserProfile = {
      userId: "U-10293",
      ageBand: "20대 후반",
      skinType: "민감+속건조",
      concerns: ["홍조", "장벽약화"],
      preference: { finish: "산뜻", fragranceFree: true, texture: ["젤", "크림"] },
      forbidden: ["향료", "알코올"],
      priceSensitivity: "중가",
      segment: "민감+속건조",
      lastPurchase: { date: "2026-02-20", items: ["시카 베리어 수분 크림", "무기자차 선크림"], channel: "APP" },
      lastViews: ["진정 앰플", "장벽 크림", "무기자차"],

    };

    /* -------------------- Runtime state -------------------- */
    const defaultState = {
      version: 10,
      stage: "EXPLORE",         // EXPLORE | COMPARE | DECIDE | POSTPURCHASE
      intent: null,
      cart: [],
      lastRoutineId: null,
      lastCategory: null,
      curationSession: null,
      aftercareSession: null,
      lastInteractionAt: Date.now(),
      lastNudgeAt: 0,
      lastDeliveryAt: 0,
      eventLog: [],
      expertReview: null,
      uiBlueprint: null,
      decisionLog: [],
      kpiFocus: "CVR",
      cvrMetrics: {
        compareEntry: 0,
        addToCart: 0,
        couponCheckoutClick: 0,
        checkoutComplete: 0
      }
    };

    let appState = Object.assign({}, defaultState, loadState() || {});
    if (!appState.version || appState.version !== 10) appState = { ...defaultState }; // safe reset on schema change
    saveState(appState);

    /* -------------------- DOM refs -------------------- */
    const device = document.getElementById("app-device");
    const homeContent = document.getElementById("home-content");

    let hasStartedConversation = false;
    const UI_STAGGER_MS = 1000;
    let uiRenderQueue = Promise.resolve();
    let uiRenderQueueVersion = 0;
    let uiRenderPendingCount = 0;
    let homeLayoutTimerIds = [];

    function queueHomeLayoutSync() {
      homeLayoutTimerIds.forEach(clearTimeout);
      homeLayoutTimerIds = [];
      requestAnimationFrame(syncHomeLayout);
      [140, 520].forEach(delay => {
        const timerId = setTimeout(() => {
          if (!isChatMode) syncHomeLayout();
        }, delay);
        homeLayoutTimerIds.push(timerId);
      });
    }

    function syncHomeLayout() {
      if (!device || !floatingInput || isChatMode) return;
      const anchorEl = homePrimaryCta || homeInputAnchor || document.querySelector(".home-subtitle");
      if (!anchorEl) return;
      const ctaRect = anchorEl.getBoundingClientRect();
      const deviceRect = device.getBoundingClientRect();
      if (!ctaRect.height) return;

      const inputHeight = floatingInput.offsetHeight || 56;
      const nextTop = Math.round(ctaRect.bottom - deviceRect.top + 16);
      const maxTop = Math.max(220, device.clientHeight - inputHeight - 20);
      const safeTop = Math.max(206, Math.min(nextTop, maxTop));
      device.style.setProperty("--home-input-top", `${safeTop}px`);
      if (homeInputGap) {
        const anchorBottom = ctaRect.bottom - deviceRect.top;
        const requiredGap = Math.max(0, (safeTop + inputHeight + 8) - anchorBottom);
        homeInputGap.style.height = `${Math.round(requiredGap)}px`;
      }
    }

    /* -------------------- Tracking -------------------- */
    function track(eventName, payload = {}) {
      const evt = {
        ts: new Date().toISOString(),
        name: eventName,
        stage: appState.stage,
        payload
      };
      appState.eventLog.push(evt);
      // Keep last 200
      if (appState.eventLog.length > 200) appState.eventLog = appState.eventLog.slice(-200);
      saveState(appState);
      console.log("[TRACK]", evt);
    }

    function trackCvr(metricName, payload = {}) {
      if (!appState.cvrMetrics) appState.cvrMetrics = { ...defaultState.cvrMetrics };
      if (typeof appState.cvrMetrics[metricName] !== "number") appState.cvrMetrics[metricName] = 0;
      appState.cvrMetrics[metricName] += 1;
      track("cvr_metric", { metricName, value: appState.cvrMetrics[metricName], ...payload });
      saveState(appState);
    }

    /* -------------------- Multi-expert strategy layer -------------------- */
    const BASE_SCENARIO_BLUEPRINT = {
      entry_menu: ["맞춤 루틴 추천", "맞춤 제품 추천", "쿠폰 적용 결제", "주문·환불 CS", "구매 후 케어", "상담원 연결"],

        compare_intro: "고객님 데이터(민감+속건조/무향 선호/홍조)를 기준으로 <b>실패 확률이 낮은 2가지 세트</b>를 준비했습니다.\n\n오늘은 어떤 마무리감이 더 적합한가요?",
        checkout_intro: "결제 단계로 이동합니다.\n지금 적용 가능한 혜택을 자동 계산했습니다.",
        cs_delivery: "최근 주문을 확인했습니다. 현재 배송 중이며 내일 도착 예상입니다.\n송장 또는 상세 추적이 필요하면 상담원 연결로 이어집니다."
      },
      quick_reply_sets: {
        startMenu: ["맞춤 루틴 추천", "맞춤 제품 추천", "쿠폰 적용 결제", "주문·환불 CS", "구매 후 케어", "상담원 연결"],
        compareMenu: ["세트 A(산뜻형) 상세 보기", "세트 B(보습형) 상세 보기", "홍조 SOS 루틴도 보여줘"],

    const HOME_CARD_LIBRARY = [
      {
        id: "recommend",

        desc: "피부 데이터와 구매 이력을 결합해 세트를 제안합니다.",
        query: "맞춤 루틴 추천 시작",

      {

        image_key: "onboarding_card_compare"

    const ChatbotExpertAgent = {

    function buildUIBlueprint(decisionPack, profile) {
      const cards = HOME_CARD_LIBRARY.map(card => {
        let score = 0;
        if (card.id === "recommend") score += 40;

    function resetUiRenderQueue() {

    function enqueueUiRender(renderFn, options = {}) {
      const immediate = Boolean(options.immediate);
      const delayMs = Number.isFinite(options.delayMs) ? Math.max(0, options.delayMs) : UI_STAGGER_MS;
      const versionAtSchedule = uiRenderQueueVersion;
      const runSafely = () => {
        if (versionAtSchedule !== uiRenderQueueVersion) return;
        try {
          renderFn();
        } catch (error) {
          console.error("ui render failed", error);
        }
      };

      if (immediate) {
        runSafely();
        return;
      }

      const waitMs = uiRenderPendingCount === 0 ? 0 : delayMs;
      uiRenderPendingCount += 1;
      uiRenderQueue = uiRenderQueue
        .catch(() => { })
        .then(() => new Promise(resolve => {
          setTimeout(() => {
            runSafely();
            uiRenderPendingCount = Math.max(0, uiRenderPendingCount - 1);
            resolve();
          }, waitMs);
        }));
    }

    function activateReviewCarousel() {
      const carousels = document.querySelectorAll(".review-carousel");
      carousels.forEach(carousel => {
        if (carousel.dataset.carouselReady === "1") return;
        carousel.dataset.carouselReady = "1";

        const list = carousel.querySelector(".review-list");
        const prevBtn = carousel.querySelector(".review-nav.prev");
        const nextBtn = carousel.querySelector(".review-nav.next");
        const dotsWrap = carousel.querySelector(".review-dots");
        if (!list || !dotsWrap) return;

        const items = Array.from(list.querySelectorAll(".review-item"));
        if (!items.length) return;

        dotsWrap.innerHTML = items.map((_, idx) =>
          `<button type="button" class="review-dot" data-index="${idx}" aria-label="리뷰 ${idx + 1}번"></button>`
        ).join("");
        const dotButtons = Array.from(dotsWrap.querySelectorAll(".review-dot"));

        const getActiveIndex = () => {
          let activeIdx = 0;
          let minDist = Number.POSITIVE_INFINITY;
          items.forEach((item, idx) => {
            const dist = Math.abs(item.offsetLeft - list.scrollLeft);
            if (dist < minDist) {
              minDist = dist;
              activeIdx = idx;
            }
          });
          return activeIdx;
        };

        const scrollToIndex = (idx) => {
          const bounded = Math.max(0, Math.min(idx, items.length - 1));
          list.scrollTo({ left: items[bounded].offsetLeft, behavior: "smooth" });
        };

        const syncCarouselUi = () => {
          const activeIdx = getActiveIndex();
          dotButtons.forEach((dot, idx) => dot.classList.toggle("is-active", idx === activeIdx));
          if (prevBtn) prevBtn.disabled = activeIdx === 0;
          if (nextBtn) nextBtn.disabled = activeIdx === items.length - 1;
        };

        if (prevBtn) prevBtn.addEventListener("click", () => scrollToIndex(getActiveIndex() - 1));
        if (nextBtn) nextBtn.addEventListener("click", () => scrollToIndex(getActiveIndex() + 1));
        dotButtons.forEach(dot => {
          dot.addEventListener("click", () => {
            scrollToIndex(Number(dot.dataset.index || 0));
          });
        });

        let rafToken = null;
        list.addEventListener("scroll", () => {
          if (rafToken) cancelAnimationFrame(rafToken);
          rafToken = requestAnimationFrame(syncCarouselUi);
        }, { passive: true });

        syncCarouselUi();
      });
    }

    const AFTERCARE_GENERIC_GUIDE = {
      usageMethod: "세안 후 자극이 적은 단계에서 소량부터 시작하고 피부 반응을 보며 사용량을 늘려주세요.",

        dry: "당김이 느껴지는 부위만 국소적으로 한 번 더 덧발라 보습막을 보완해 주세요.",

        stable: "현재 루틴이 안정적이면 같은 순서/양을 유지하고 환경 변화 시에만 조절해 주세요."

    function getAftercareGuideByName(productName) {
      return AFTERCARE_GUIDE_LIBRARY[productName] || AFTERCARE_GENERIC_GUIDE;
    }

    function getRecentPurchaseProductsForAftercare() {
      const purchase = mockUserProfile.lastPurchase || {};
      const items = Array.isArray(purchase.items) ? purchase.items : [];
      return items.map((name, idx) => ({
        id: `recent_${idx + 1}`,
        name,
        purchasedAt: purchase.date || "",
        channel: purchase.channel || "",
        guide: getAftercareGuideByName(name)
      }));
    }

    function renderAftercareRecentProductsCard(products) {
      if (!products.length) {
        return `
      <b>최근 구매 제품</b>
      <div style="margin-top:8px; font-size:12px; color:#555; line-height:1.5;">
        최근 구매 이력이 확인되지 않아 바로 제품명을 입력받아 케어를 시작할게요.
      </div>`;
      }

      const rows = products.map((product, idx) => `
      <div style="padding:4px 0;">
        <div style="font-size:12px; font-weight:800; color:#1f2937;">${idx + 1}) ${escapeHtml(product.name)}</div>
        <div style="margin-top:3px; font-size:11px; color:#667085;">구매일 ${escapeHtml(product.purchasedAt || "-")} · 채널 ${escapeHtml(product.channel || "-")}</div>
      </div>
    `).join("");

      return `
    <b>최근 구매 제품 목록</b>
    <div style="margin-top:8px; display:grid; gap:4px;">${rows}</div>
    <div style="margin-top:9px; font-size:11px; color:#667085;">제품명을 선택하면 맞춤 질문 후 케어 가이드를 바로 시작합니다.</div>`;
    }

    function resolveAftercareConcern(text) {
      const t = String(text || "").toLowerCase();
      if (t.includes("건조") || t.includes("당김")) return { key: "dry", label: "건조/당김" };
      if (t.includes("붉") || t.includes("따가") || t.includes("열감")) return { key: "red", label: "붉은기/따가움" };
      if (t.includes("트러블") || t.includes("막힘") || t.includes("뾰루지")) return { key: "trouble", label: "트러블/막힘" };
      if (t.includes("문제없") || t.includes("괜찮")) return { key: "stable", label: "문제없음" };
      return null;
    }

    function resolveAftercareUsageTime(text) {
      const t = String(text || "").toLowerCase();
      if ((t.includes("아침") && t.includes("저녁")) || t.includes("모두")) return { key: "both", label: "아침/저녁 모두" };
      if (t.includes("아침") || t.includes("낮")) return { key: "am", label: "아침" };
      if (t.includes("저녁") || t.includes("밤")) return { key: "pm", label: "저녁" };
      return null;
    }

    function renderAftercarePlanCard(session) {
      const productName = session.selectedProduct || "선택 제품";
      const guide = getAftercareGuideByName(productName);
      const concern = session.answers?.concern || { key: "stable", label: "문제없음" };
      const usageTime = session.answers?.usageTime || { key: "both", label: "아침/저녁 모두" };

      const usageByTime = usageTime.key === "am" ? guide.amTip
        : usageTime.key === "pm" ? guide.pmTip
          : guide.bothTip;
      const concernAdvice = guide.concernAdvice?.[concern.key] || guide.concernAdvice?.stable;

      appendCard(`
    <b>${escapeHtml(productName)} 맞춤 케어 가이드</b>
    <div style="margin-top:9px; font-size:12px; color:#344054; line-height:1.55;">
      <b>1) 사용법</b><br>
      ${escapeHtml(guide.usageMethod)}<br><br>
      <b>2) 사용 순서</b><br>
      ${escapeHtml(guide.usageOrder)}<br><br>
      <b>3) 주요 성분 설명</b><br>
      ${escapeHtml(guide.ingredients)}<br>
      <span style="color:#667085;">${escapeHtml(guide.ingredientExplain)}</span><br><br>
      <b>4) 현재 반응(${escapeHtml(concern.label)}) 기준 케어</b><br>
      ${escapeHtml(concernAdvice)}<br><br>
      <b>5) 사용 시간대(${escapeHtml(usageTime.label)}) 팁</b><br>
      ${escapeHtml(usageByTime)}<br><br>
      <b>주의</b><br>
      ${escapeHtml(guide.caution)}
    </div>
  `);
    }

    function getAftercareInfoMenuOptions() {
      return ["사용 가이드", "반응/주의 가이드", "성분 가이드", "전체 가이드", "다른 제품 선택"];
    }

    function appendAftercareInfoMenu(session) {
      const productName = session?.selectedProduct || "선택 제품";
      appendMessage("bot", `<b>${escapeHtml(productName)}</b> 케어 항목이에요.\n비슷한 내용끼리 묶어 두었어요. 원하는 묶음을 선택해 주세요.`);
      appendQuickReplies(getAftercareInfoMenuOptions());
    }

    function renderAftercareUsageBundleCard(productName, guide, usageTime) {
      const usageLabel = usageTime?.label || "아침/저녁 모두";
      const usageKey = usageTime?.key || "both";
      const usageByTime = usageKey === "am" ? guide.amTip
        : usageKey === "pm" ? guide.pmTip
          : guide.bothTip;

      appendCard(`
    <b>${escapeHtml(productName)} 사용 가이드</b>
    <div style="margin-top:8px; font-size:12px; color:#344054; line-height:1.55;">
      <b>1) 사용법</b><br>
      ${escapeHtml(guide.usageMethod)}<br><br>
      <b>2) 사용 순서</b><br>
      ${escapeHtml(guide.usageOrder)}<br><br>
      <b>3) 사용 시간대 팁 (${escapeHtml(usageLabel)})</b><br>
      ${escapeHtml(usageByTime)}
    </div>
  `);
    }

    function renderAftercareReactionCautionBundleCard(productName, guide, concern) {
      const resolvedConcern = concern || { key: "stable", label: "문제없음" };
      const concernAdvice = guide.concernAdvice?.[resolvedConcern.key] || guide.concernAdvice?.stable;

      appendCard(`
    <b>${escapeHtml(productName)} 반응/주의 가이드</b>
    <div style="margin-top:8px; font-size:12px; color:#344054; line-height:1.55;">
      <b>1) 현재 반응 기준 케어 (${escapeHtml(resolvedConcern.label)})</b><br>
      ${escapeHtml(concernAdvice)}<br><br>
      <b>2) 주의사항</b><br>
      ${escapeHtml(guide.caution)}
    </div>
  `);
    }

    function renderAftercareIngredientBundleCard(productName, guide) {
      appendCard(`
    <b>${escapeHtml(productName)} 성분 가이드</b>
    <div style="margin-top:8px; font-size:12px; color:#344054; line-height:1.55;">
      <b>주요 성분</b><br>
      ${escapeHtml(guide.ingredients)}<br><br>
      <b>성분 설명</b><br>
      <span style="color:#667085;">${escapeHtml(guide.ingredientExplain)}</span>
    </div>
  `);
    }

    function beginAftercareGuide(triggerSource = "manual") {
      inferStageFromAction("postpurchase_followup");
      const products = getRecentPurchaseProductsForAftercare();

      appState.aftercareSession = {
        step: "select_product",
        triggerSource,
        products: products.map(product => product.name),
        selectedProduct: null,
        answers: {},
        pendingTopic: null,
        startedAt: Date.now()
      };
      saveState(appState);
      track("aftercare_flow_start", { triggerSource, productCount: products.length });

      const introMessage = triggerSource === "delivery_followup"
        ? "최근 구매 제품 기준으로 케어를 이어갈게요.\n관리할 제품을 먼저 선택해 주세요."
        : "구매 후 케어를 시작할게요.\n먼저 최근에 구매하신 제품 중 관리할 제품을 선택해 주세요.";
      appendMessage("bot", introMessage);
      appendCard(renderAftercareRecentProductsCard(products));

      if (!products.length) {
        appState.aftercareSession = null;
        saveState(appState);
        appendQuickReplies(["상담원 연결", "맞춤 루틴 추천", "맞춤 제품 추천"]);
        return;
      }

      appendQuickReplies([...products.slice(0, 3).map(product => product.name), "최근 구매 목록 다시 보기"]);
    }

    function handleAftercareFlow(text) {
      const t = String(text || "").toLowerCase();
      const session = appState.aftercareSession;

      if (!session) return false;

      const shouldExit = t.includes("상담원 연결") || t.includes("주문·환불") || t.includes("환불")
        || t.includes("반품") || t.includes("배송 조회") || t.includes("맞춤 루틴 추천") || t.includes("맞춤 제품 추천");
      if (shouldExit) {
        appState.aftercareSession = null;
        saveState(appState);
        return false;
      }

      if (session.step === "select_product") {
        if (t.includes("목록") || t.includes("다시 보기")) {
          const products = getRecentPurchaseProductsForAftercare();
          appendCard(renderAftercareRecentProductsCard(products));
          appendQuickReplies([...products.slice(0, 3).map(product => product.name), "최근 구매 목록 다시 보기"]);
          return true;
        }

        const matchedProduct = (session.products || []).find(name => t.includes(String(name).toLowerCase()));
        if (!matchedProduct) {
          appendMessage("bot", "최근 구매 제품 중에서 먼저 선택해 주세요.");
          appendQuickReplies([...(session.products || []).slice(0, 3), "최근 구매 목록 다시 보기"]);
          return true;
        }

        session.selectedProduct = matchedProduct;
        session.step = "info_menu";
        session.answers = {};
        session.pendingTopic = null;
        saveState(appState);
        track("aftercare_product_selected", { product: matchedProduct, triggerSource: session.triggerSource });

        appendAftercareInfoMenu(session);
        return true;
      }

      if (session.step === "info_menu") {
        const productName = session.selectedProduct || "선택 제품";
        const guide = getAftercareGuideByName(productName);

        if (t.includes("다른 제품 선택")) {
          session.step = "select_product";
          session.pendingTopic = null;
          saveState(appState);
          appendMessage("bot", "좋아요. 다시 최근 구매 제품 목록에서 선택해 주세요.");
          appendQuickReplies([...(session.products || []).slice(0, 3), "최근 구매 목록 다시 보기"]);
          return true;
        }

        if (t.includes("성분 가이드") || t.includes("주요 성분") || t.includes("성분")) {
          renderAftercareIngredientBundleCard(productName, guide);
          appendQuickReplies(getAftercareInfoMenuOptions());
          return true;
        }

        if (t.includes("사용 가이드") || t.includes("사용법") || t.includes("사용 순서") || t.includes("사용 시간대")) {
          if (session.answers?.usageTime) {
            renderAftercareUsageBundleCard(productName, guide, session.answers.usageTime);
            appendQuickReplies(getAftercareInfoMenuOptions());
            return true;
          }
          session.step = "question_usage_time";
          session.pendingTopic = "usage_bundle";
          saveState(appState);
          appendMessage("bot", "사용 시간대를 먼저 알려주시면 사용 가이드를 묶어서 안내해드릴게요.");
          appendQuickReplies(["아침에 사용해", "저녁에 사용해", "아침/저녁 모두 사용해"]);
          return true;
        }

        if (t.includes("반응/주의 가이드") || t.includes("현재 반응") || t.includes("주의사항") || t.includes("반응")) {
          if (session.answers?.concern) {
            renderAftercareReactionCautionBundleCard(productName, guide, session.answers.concern);
            appendQuickReplies(getAftercareInfoMenuOptions());
            return true;
          }
          session.step = "question_concern";
          session.pendingTopic = "reaction_caution_bundle";
          saveState(appState);
          appendMessage("bot", "현재 피부 반응을 알려주시면 반응/주의 가이드를 묶어서 안내해드릴게요.");
          appendQuickReplies(["건조/당김이 있어", "붉은기/따가움이 있어", "트러블/막힘이 있어", "문제없어"]);
          return true;
        }

        if (t.includes("전체 가이드")) {
          track("aftercare_plan_generated", {
            product: session.selectedProduct,
            concern: session.answers?.concern?.key || "stable",
            usageTime: session.answers?.usageTime?.key || "both"
          });
          appendMessage("bot", "선택한 항목을 반영한 전체 케어 가이드입니다.");
          renderAftercarePlanCard(session);
          appendQuickReplies(getAftercareInfoMenuOptions());
          return true;
        }

        appendMessage("bot", "아래 버튼에서 원하는 케어 정보를 선택해 주세요.");
        appendQuickReplies(getAftercareInfoMenuOptions());
        return true;
      }

      if (session.step === "question_concern") {
        const concern = resolveAftercareConcern(text);
        if (!concern) {
          appendMessage("bot", "현재 피부 반응 항목을 선택해 주세요.");
          appendQuickReplies(["건조/당김이 있어", "붉은기/따가움이 있어", "트러블/막힘이 있어", "문제없어"]);
          return true;
        }

        session.answers.concern = concern;
        session.step = "info_menu";
        const pendingTopic = session.pendingTopic || "";
        session.pendingTopic = null;
        saveState(appState);
        const productName = session.selectedProduct || "선택 제품";
        const guide = getAftercareGuideByName(productName);
        if (pendingTopic === "reaction_caution_bundle") {
          renderAftercareReactionCautionBundleCard(productName, guide, concern);
        } else {
          renderAftercareReactionCautionBundleCard(productName, guide, concern);
        }
        appendQuickReplies(getAftercareInfoMenuOptions());
        return true;
      }

      if (session.step === "question_usage_time") {
        const usageTime = resolveAftercareUsageTime(text);
        if (!usageTime) {
          appendMessage("bot", "사용 시간대를 선택해 주세요.");
          appendQuickReplies(["아침에 사용해", "저녁에 사용해", "아침/저녁 모두 사용해"]);
          return true;
        }

        session.answers.usageTime = usageTime;
        session.step = "info_menu";
        const pendingTopic = session.pendingTopic || "";

    function detectProductIntent(text) {
      const t = String(text || "").toLowerCase();
      const hasTonerKeyword = t.includes("토너") || t.includes("스킨") || t.includes("toner");
      const hasRecommendIntent = t.includes("추천") || t.includes("골라") || t.includes("뭐가 좋아") || t.includes("어떤") || t.includes("찾아줘");
      if (hasTonerKeyword && hasRecommendIntent) return { category: "toner", action: "recommend" };
      return null;
    }

    function getTonerById(id) {
      return TONER_CATALOG.find(p => p.id === id) || null;
    }

    function normalizePriceBandForProfile(priceSensitivity) {
      if (priceSensitivity === "중가") return { low: 0.9, mid: 1, high: 0.55 };
      if (priceSensitivity === "고가") return { low: 0.75, mid: 0.9, high: 1 };
      return { low: 1, mid: 0.85, high: 0.65 };
    }

    function resolveConcernAnswer(text) {
      const t = String(text || "").toLowerCase();
      if (t.includes("진정") || t.includes("홍조")) return { key: "soothe", label: "진정/홍조" };
      if (t.includes("속건조") || t.includes("보습") || t.includes("당김")) return { key: "hydrate", label: "속건조 보습" };
      if (t.includes("각질") || t.includes("결") || t.includes("모공")) return { key: "texture", label: "각질결 정돈" };
      return null;
    }

    function resolveFinishAnswer(text) {
      const t = String(text || "").toLowerCase();
      if (t.includes("산뜻") || t.includes("가벼")) return "산뜻";
      if (t.includes("촉촉") || t.includes("보습감")) return "촉촉";
      if (t.includes("중간") || t.includes("밸런스")) return "중간";
      return null;
    }

    function resolvePriorityAnswer(text) {
      const t = String(text || "").toLowerCase();
      if (t.includes("저자극") || t.includes("민감") || t.includes("순하")) return "저자극 최우선";
      if (t.includes("효능") || t.includes("빠른") || t.includes("즉시")) return "효능 우선";
      return null;
    }

    function extractTonerBundleAnswers(text) {
      const concernAnswer = resolveConcernAnswer(text);
      const finishAnswer = resolveFinishAnswer(text);
      const priorityAnswer = resolvePriorityAnswer(text);
      return {
        concern: concernAnswer?.key || null,
        concernLabel: concernAnswer?.label || null,
        finish: finishAnswer || null,
        priority: priorityAnswer || null
      };
    }

    function deriveDefaultTonerAnswers(profile) {
      const concern = profile.concerns?.includes("홍조") ? { key: "soothe", label: "진정/홍조" } :
        profile.concerns?.includes("장벽약화") ? { key: "hydrate", label: "속건조 보습" } :
          { key: "hydrate", label: "속건조 보습" };

      let finish = "중간";
      if (profile.preference?.finish?.includes("산뜻")) finish = "산뜻";
      else if (profile.preference?.finish?.includes("촉촉")) finish = "촉촉";

      return {
        concern: concern.key,
        concernLabel: concern.label,
        finish,
        priority: "저자극 최우선"
      };
    }

    function concernLabelFromKey(key) {
      if (key === "soothe") return "진정/홍조";
      if (key === "hydrate") return "속건조 보습";
      if (key === "texture") return "각질결 정돈";
      return "핵심 고민";
    }

    function rankToners(profile, answers, factors = TONER_DECISION_FACTORS) {
      const concernWeight = (factors.find(f => f.key === "concern_fit")?.weight || 0.45) * 100;
      const finishWeight = (factors.find(f => f.key === "finish_fit")?.weight || 0.25) * 100;
      const sensitivityWeight = (factors.find(f => f.key === "sensitivity")?.weight || 0.2) * 100;
      const priceWeight = (factors.find(f => f.key === "price_value")?.weight || 0.1) * 100;
      const priceBandScore = normalizePriceBandForProfile(profile.priceSensitivity);

      return TONER_CATALOG.map(product => {
        const concernScore = answers.concern && product.concerns.includes(answers.concern) ? 1 : 0.2;
        const finishScore = answers.finish === product.finish ? 1 : (answers.finish === "중간" ? 0.6 : 0.3);
        const sensitivityScore = answers.priority === "효능 우선"
          ? Math.min(1, (product.efficacyScore * 0.7) + ((1 - product.irritationRisk) * 0.3))
          : Math.max(0, 1 - product.irritationRisk);
        const priceScore = priceBandScore[product.priceBand] ?? 0.8;

        const forbiddenHits = (profile.forbidden || []).filter(forbidden =>
          product.ingredients.some(ing => ing.includes(forbidden))
        );

        const breakdown = {
          concern: concernScore * concernWeight,
          finish: finishScore * finishWeight,
          sensitivity: sensitivityScore * sensitivityWeight,
          price: priceScore * priceWeight
        };

        let total = breakdown.concern + breakdown.finish + breakdown.sensitivity + breakdown.price;
        if (forbiddenHits.length > 0) total -= 75;

        const reasonCandidates = [
          { text: `${answers.concernLabel || "핵심 고민"} 대응 성분/기능 매칭`, score: breakdown.concern },
          { text: `${answers.finish || "중간"} 사용감 선호와 일치`, score: breakdown.finish },
          { text: `${answers.priority || "저자극"} 기준 점수 우수`, score: breakdown.sensitivity },
          { text: `가격 민감도(${profile.priceSensitivity}) 대비 적합`, score: breakdown.price }
        ].sort((a, b) => b.score - a.score);

        const reasons = reasonCandidates.slice(0, 2).map(item => item.text);
        if (forbiddenHits.length > 0) {
          reasons.push(`금기 성분(${forbiddenHits.join(", ")}) 감점 적용`);
        }

        return {
          ...product,
          score: Number(total.toFixed(2)),
          reasons,
          forbiddenHits
        };
      }).sort((a, b) => b.score - a.score);
    }

        finish: session.answers.finish,

    function findMatchedReviews(profile, answers, selectedProducts) {
      const targetIds = new Set((selectedProducts || []).map(p => p.id));
      const profileConcerns = profile.concerns || [];

      const scored = MOCK_REVIEW_POOL
        .filter(review => targetIds.has(review.productId))
        .map(review => {
          let similarity = 0;
          if (review.skinType === profile.skinType) similarity += 3;
          const overlapCount = (review.concerns || []).filter(c => profileConcerns.includes(c)).length;
          similarity += overlapCount;
          if (review.finish === answers.finish) similarity += 2;
          return { ...review, similarity };
        })
        .sort((a, b) => b.similarity - a.similarity);

      let filtered = scored.filter(r => r.similarity >= 5);
      let expanded = false;
      if (filtered.length < 4) {
        filtered = scored.filter(r => r.similarity >= 3);
        expanded = true;
      }

      const byProduct = {};
      filtered.forEach(review => {
        if (!byProduct[review.productId]) byProduct[review.productId] = [];
        if (byProduct[review.productId].length < 3) byProduct[review.productId].push(review);
      });

      const concernCountMap = {};
      filtered.forEach(review => {
        concernCountMap[review.concernTag] = (concernCountMap[review.concernTag] || 0) + 1;
      });
      const topConcerns = Object.entries(concernCountMap)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3)
        .map(([tag, count]) => ({ tag, count }));

      return { expanded, byProduct, topConcerns, totalMatched: filtered.length };
    }

      track("restart_from_header", {});
      inputEl.focus();
    }

    function pushAgentSummary(issue) {
      const summary = {
        userId: mockUserProfile.userId,
        segment: mockUserProfile.segment,
        issue,
        stage: appState.stage,
        lastPurchase: mockUserProfile.lastPurchase,
        cartCount: (appState.cart || []).length
      };
      track("agent_summary_generated", summary);
      appendCard(`
    <b>상담원 전달 요약</b>
    <div style="margin-top:8px; font-size:12px; color:#555; line-height:1.45;">
      • 고객: <b>${escapeHtml(summary.userId)}</b> (${escapeHtml(summary.segment)})<br>
      • 이슈: <b>${escapeHtml(issue)}</b><br>
      • 최근 구매: <b>${escapeHtml(summary.lastPurchase.date)}</b> / ${escapeHtml(summary.lastPurchase.items.join(", "))}<br>
      • AI 진행: <b>기본 안내 완료</b> → 상담원 접수 권장
    </div>
  `);
    }

    function handleCS(issue) {
      inferStageFromAction("cs");
      track("cs_issue", { issue });

      if (issue.includes("반품") || issue.includes("환불")) {
        appendMessage("bot", `반품/환불을 도와드릴게요.\n정책 요약: <b>${POLICIES.returnWindowDays}일</b> 이내 가능, ${POLICIES.returnShipping}\n\n상품이 <b>불량/오배송</b>인가요, 아니면 <b>단순 변심</b>인가요?`);
        appendQuickReplies(["불량/오배송", "단순 변심", "상담원 연결"]);
        return;
      }

      if (issue.includes("배송")) {
        const delivery = getDeliveryData();
        appendMessage("bot", getTemplate("cs_delivery"));
        if (delivery.stage === "in_transit") {
          renderDeliveryStatusCard(delivery);
        }
        appendQuickReplies(["배송이 더 늦어지면?", "상담원 연결"]);
        return;
      }

      if (issue.includes("불량") || issue.includes("오배송")) {
        appendMessage("bot", `불편을 드려 죄송합니다.\n정책: ${POLICIES.defectShipping}\n사진 1장만 있으면 접수 속도가 빨라집니다. 상담원 연결로 바로 넘길까요?`);
        appendQuickReplies(["상담원 연결", "내가 직접 접수할래"]);
        return;
      }

      appendMessage("bot", "어떤 도움을 드릴까요?");
      appendQuickReplies(["배송 문의", "환불/교환", "상담원 연결"]);
    }

    /* -------------------- Behavior triggers (demo) -------------------- */
    let nudgeTimer = null;
    function scheduleCartNudge() {
      // demo: if cart exists and no interaction for 25 seconds, nudge once every 90 seconds max
      if (nudgeTimer) clearTimeout(nudgeTimer);
      nudgeTimer = setTimeout(() => {
        const now = Date.now();
        const idleMs = now - (appState.lastInteractionAt || now);
        const canNudge = (now - (appState.lastNudgeAt || 0)) > 90_000;
        const hasCart = (appState.cart || []).length > 0;
        if (hasCart && idleMs >= 25_000 && canNudge) {
          appState.lastNudgeAt = now;
          saveState(appState);
          track("nudge_cart_idle", { idleMs, cartCount: appState.cart.length });
          appendMessage("bot", "결제를 망설이게 하는 포인트가 있을까요?\n지금은 <b>오늘 자정까지 15% 쿠폰</b>이 자동 적용됩니다.");
          appendQuickReplies(["쿠폰 적용하고 결제할래", "성분이 걱정돼", "가격이 부담돼", "상담원 연결"]);
        }
      }, 25_000);
    }

    function schedulePostPurchaseFollowup() {
      // demo: 12 seconds later, follow-up care message
      setTimeout(() => {
        const now = Date.now();
        if ((now - (appState.lastDeliveryAt || 0)) < 10_000) return; // avoid spam
        appState.lastDeliveryAt = now;
        saveState(appState);
        track("postpurchase_followup", {});
        appendMessage("bot", "배송 완료 후 케어 점검을 시작할게요.");
        beginAftercareGuide("delivery_followup");
      }, 12_000);
    }

    function startAftercareGuide() {
      beginAftercareGuide("manual");
    }

    /* -------------------- Demo panel -------------------- */
    function openDemoPanel() {
      if (!isChatMode) {
        triggerChat();
      }
      track("demo_panel_open", {});
      appendCard(`
    <b>상태 패널</b>
    <div style="margin-top:8px; font-size:12px; color:#555; line-height:1.6;">
      • 현재 Stage: <b>${escapeHtml(appState.stage)}</b><br>
      • Cart: <b>${escapeHtml((appState.cart || []).length.toString())}</b> items<br>
      • 프로필: <b>${escapeHtml(mockUserProfile.skinType)}</b> / ${escapeHtml(mockUserProfile.concerns.join(", "))}<br>
      • KPI Focus: <b>${escapeHtml(appState.kpiFocus || "CVR")}</b><br>
      • CVR Metrics: 비교 ${escapeHtml(String(appState.cvrMetrics?.compareEntry || 0))} / 담기 ${escapeHtml(String(appState.cvrMetrics?.addToCart || 0))} / 쿠폰결제 ${escapeHtml(String(appState.cvrMetrics?.couponCheckoutClick || 0))} / 결제완료 ${escapeHtml(String(appState.cvrMetrics?.checkoutComplete || 0))}<br>
      • Expert Decisions: <b>${escapeHtml(String(appState.decisionLog?.length || 0))}</b>
    </div>
  `);
      appendQuickReplies(["루틴 추천 시작", "CS: 반품", "CS: 배송", "배송완료 이벤트", "초기화"]);
    }

    function resetDemo() {
      localStorage.removeItem(STORAGE_KEY);
      appState = { ...defaultState };
      saveState(appState);
      resetUiRenderQueue();
      chatContent.innerHTML = "";
      stagePill.textContent = appState.stage;
      hasStartedConversation = false;
      resetToHome();
    }

    /* -------------------- Escape helper -------------------- */
    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function startChatSession() {
      resetUiRenderQueue();
      chatContent.innerHTML = "";
      stagePill.textContent = appState.stage || "EXPLORE";
      ensureExpertReviewReady();
    }

    function triggerChat(initialMessage = "") {
      if (!isChatMode) {
        device.classList.add("chat-mode");
        inputEl.placeholder = "메시지를 입력하세요...";
        isChatMode = true;
      }

      if (!hasStartedConversation) {
        hasStartedConversation = true;
        startChatSession();
      }

      if (initialMessage) {
        setTimeout(() => {
          onUserMessage(initialMessage, { source: "home_card" });
        }, 420);
      }
    }

    function resetToHome() {
      resetUiRenderQueue();
      device.classList.remove("chat-mode");
      inputEl.placeholder = "원하시는 기능을 선택하거나 직접 입력해 주세요";
      isChatMode = false;
      hasStartedConversation = false;
      hideTyping();
      if (nudgeTimer) {
        clearTimeout(nudgeTimer);
        nudgeTimer = null;
      }
      chatContent.innerHTML = "";
      stagePill.textContent = appState.stage || "EXPLORE";
      queueHomeLayoutSync();
    }

    /* -------------------- Main router -------------------- */
    function onUserMessage(text, meta = {}) {
      const clean = (text || "").trim();
      if (!clean) return;

      // update interaction time
      appState.lastInteractionAt = Date.now();
      saveState(appState);

      // render user message
      appendMessage("user", escapeHtml(clean), { immediate: true });
      track("user_message", { text: clean, source: meta.source || "input" });

      showTyping();
      setTimeout(() => {
        hideTyping();
        route(clean);
      }, 650);
    }

    function route(text) {
      const t = text.toLowerCase();
      ensureExpertReviewReady();
      const detectedProductIntent = detectProductIntent(text);

      // Global commands
      if (t.includes("초기화")) { resetDemo(); return; }
      if (t.includes("메뉴")) { showStartMenu(); return; }
      if (t.includes("맞춤 제품 추천") || t.includes("제품 맞춤 추천") || (t.includes("제품") && t.includes("추천")) || t.includes("세트 비교 분석")) { startProductRecommendationScenario(text); return; }
      if (t.includes("조건 바꿔서 다시 추천") && appState.lastCategory === "toner") {
        startTonerRecommendationFlow(text);
        return;
      }
      if (t.includes("두 제품 성분 비교")) {
        if (showTonerIngredientComparison()) {
          track("toner_compare_view", { picks: appState.curationSession?.finalIds || [] });
          appendQuickReplies(["첫 번째 제품 루틴에 담기", "조건 바꿔서 다시 추천", "쿠폰 적용하고 결제할래"]);
          return;
        }
      }
      if (t.includes("첫 번째 제품 루틴에 담기")) {
        if (addTopTonerToCart()) return;
      }
      if (detectedProductIntent?.category === "toner") {
        startTonerRecommendationFlow(text);
        return;
      }
      if (handleUnavailableProductRecommendation(text)) return;
      if (appState.curationSession?.category === "toner" && appState.curationSession.step !== "completed") {
        if (applyTonerCurationAnswer(text)) return;

        const exitCuration = t.includes("상담원") || t.includes("배송") || t.includes("환불") || t.includes("반품")
          || t.includes("구매 후 케어") || t.includes("맞춤 루틴") || t.includes("세트 비교") || t.includes("맞춤 제품 추천") || t.includes("제품 맞춤 추천");
        if (exitCuration) {
          track("toner_curation_exit", { reasonText: text });
          appState.curationSession = null;
          saveState(appState);
        } else {
          appendMessage("bot", "토너 큐레이션 진행 중이에요. 아래 선택지 중 하나를 골라주세요.");
          askTonerCurationQuestion(appState.curationSession.step);
          return;
        }
      }

      if (t.includes("다른 제품 케어도 시작")) {
        startAftercareGuide();
        return;
      }
      if (handleAftercareFlow(text)) return;

      // Demo shortcuts
      if (t.includes("루틴 추천 시작") || t.includes("루틴 추천 받기") || t.includes("맞춤 루틴 추천") || t.includes("추천")) {
        showRoutineAB();
        return;
      }
      if (t.includes("세트 a")) { showRoutineDetail("barrier_set_A_light"); return; }
      if (t.includes("세트 b")) { showRoutineDetail("barrier_set_B_rich"); return; }
      if (t.includes("홍조") && t.includes("sos")) { showRoutineDetail("sos_redness"); return; }
      if (t.includes("상세 보기") && t.includes("a")) { showRoutineDetail("barrier_set_A_light"); return; }
      if (t.includes("상세 보기") && t.includes("b")) { showRoutineDetail("barrier_set_B_rich"); return; }
      if (t.includes("배송 조회")) { handleCS("배송 지연/현황"); return; }
      if (t.includes("환불/교환") || t.includes("환불 교환")) { handleCS("반품/환불"); return; }
      if (t.includes("쿠폰/혜택") || t.includes("쿠폰 혜택") || t.includes("쿠폰 적용 결제")) { checkout(); return; }
      if (t.includes("주문·환불 cs") || t.includes("주문/환불 cs") || t.includes("주문 환불")) {
        appendMessage("bot", "주문/환불 관련해서 필요한 항목을 선택해 주세요.");
        appendQuickReplies(["배송 조회", "환불/교환", "상담원 연결"]);
        return;
      }
      if (t.includes("구매 후 케어")) { startAftercareGuide(); return; }
      if (t.includes("장바구니")) {
        if (t.includes("담기") || t.includes("업데이트된")) { addSetToCart(); return; }
      }
      if (appState.lastCategory === "toner" && t.includes("성분") && (t.includes("비교") || t.includes("차이"))) {
        if (showTonerIngredientComparison()) {
          appendQuickReplies(["첫 번째 제품 루틴에 담기", "조건 바꿔서 다시 추천", "쿠폰 적용하고 결제할래"]);
          return;
        }
      }
      if (t.includes("구성 바꾸기") || t.includes("조금만 바꿀")) { compositionTweaks(); return; }
      if (t.includes("끈적") || t.includes("홍조 진정") || t.includes("밤 보습") || t.includes("성분")) { applyTweak(text); return; }
      if (t.includes("비교")) { showRoutineAB(); return; }
      if (t.includes("쿠폰") && t.includes("결제")) { trackCvr("couponCheckoutClick", { source: "route_text" }); checkout(); return; }
      if (t.includes("결제 완료")) { completePurchaseDemo(); schedulePostPurchaseFollowup(); return; }
      if (t.includes("배송 알림")) { appendMessage("bot", "좋아요. 배송 단계별로 알림을 드릴게요."); schedulePostPurchaseFollowup(); return; }
      if (t.includes("배송완료 이벤트")) { schedulePostPurchaseFollowup(); appendMessage("bot", "배송 완료 이벤트를 발생시켰어요."); return; }

      // CS paths
      if (t.includes("cs") || t.includes("문의") || t.includes("환불") || t.includes("반품") || t.includes("배송") || t.includes("불량") || t.includes("오배송")) {
        if (t.includes("상담원")) { connectAgent(); return; }
        if (t.includes("불량/오배송") || t.includes("불량") || t.includes("오배송")) { handleCS("불량/오배송"); return; }
        if (t.includes("단순 변심")) { appendMessage("bot", `단순 변심 반품 접수는 가능해요.\n정책: ${POLICIES.returnWindowDays}일 이내, ${POLICIES.returnShipping}\n상담원 연결로 접수할까요?`); appendQuickReplies(["상담원 연결", "아니, 내가 할래"]); return; }
        if (t.includes("배송")) { handleCS("배송 지연/현황"); return; }
        if (t.includes("환불") || t.includes("반품")) { handleCS("반품/환불"); return; }
        if (t.includes("불량")) { handleCS("불량"); return; }
      }

      // Agent escalation
      if (t.includes("상담원 연결")) {
        connectAgent();
        return;
      }
      if (t.includes("배송이 늦어") || t.includes("반품하고") || t.includes("불량이야")) {
        pushAgentSummary(text);
        appendMessage("bot", "상담원 연결을 진행합니다.\n잠시만 기다려 주세요.");
        return;
      }

      if (t.includes("알림 받을래")) {
        track("retention_opt_in_demo", {});
        appendMessage("bot", "알림 설정 완료!\n다음 체크 시점에 맞춰 안내드릴게요.");
        return;
      }

      // Default fallback: offer next best actions based on stage
      if (appState.stage === "DECIDE" && (appState.cart || []).length > 0) {
        appendMessage("bot", "지금은 장바구니에 구성이 담겨 있어요.\n바로 결제하시거나, 구성 미세 조정도 가능해요.");
        const fallbackSet = getBlueprint().fallback_rules?.undecided_decide_stage || ["쿠폰 적용하고 결제할래", "구성 바꾸기", "상담원 연결"];
        appendQuickReplies(fallbackSet);
        scheduleCartNudge();
        return;
      }

      appendMessage("bot", "원하시는 방향을 빠르게 도와드릴게요. 아래에서 선택해 주세요.");
      appendQuickReplies(["맞춤 루틴 추천", "맞춤 제품 추천", "주문·환불 CS", "상담원 연결"]);
    }

    /* -------------------- Input wiring -------------------- */
    function sendFromInput() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      if (!isChatMode) {
        triggerChat(text);
        return;
      }
      onUserMessage(text, { source: "input" });
    }
    inputEl.addEventListener("keypress", (e) => { if (e.key === "Enter") sendFromInput(); });

    function openImagePicker() {
      imageInputEl?.click();
    }

    function handleImageSelected(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      if (!isChatMode) {
        triggerChat();
      }

      const postImageMessage = () => {
        appendMessage("user", `이미지 첨부: ${escapeHtml(file.name)}`, { immediate: true });
        track("image_upload_demo", { name: file.name, size: file.size, type: file.type || "unknown" });
        showTyping();
        setTimeout(() => {
          hideTyping();
          appendMessage("bot", "이미지를 확인했어요. 원하시면 제품 식별, 성분 확인, 추천 루틴 중 하나로 이어서 도와드릴게요.");
          appendQuickReplies(["이 이미지 제품 추천해줘", "성분 확인해줘", "상담원 연결"]);
        }, 520);
      };

      if (hasStartedConversation) postImageMessage();
      else setTimeout(postImageMessage, 420);

      event.target.value = "";
    }
    imageInputEl?.addEventListener("change", handleImageSelected);

    /* -------------------- Boot -------------------- */
    function showStartMenu() {
      ensureExpertReviewReady();
      const entryMenu = getBlueprint().entry_menu || ["맞춤 루틴 추천", "맞춤 제품 추천", "쿠폰 적용 결제", "주문·환불 CS", "구매 후 케어", "상담원 연결"];
      appendCard(`
    <b>핵심 시나리오 가이드</b>
    <div style="margin-top:8px; font-size:12px; color:#555; line-height:1.55;">
      • 맞춤 루틴 추천 / 맞춤 제품 추천<br>
      • 쿠폰 적용 결제 전환<br>
      • 주문·환불 CS 처리<br>
      • 구매 후 피부 반응 케어
    </div>
  `);
      appendQuickReplies(entryMenu);
    }

    function boot() {
      resetUiRenderQueue();
      stagePill.textContent = appState.stage || "EXPLORE";
      ensureExpertReviewReady();
      device.classList.remove("chat-mode");
      inputEl.placeholder = "원하시는 기능을 선택하거나 직접 입력해 주세요";
      isChatMode = false;
      hasStartedConversation = false;
      chatContent.innerHTML = "";
      queueHomeLayoutSync();
    }
    boot();

    window.addEventListener("resize", queueHomeLayoutSync);
    window.addEventListener("load", queueHomeLayoutSync);
    homeContent?.addEventListener("transitionend", (event) => {
      if (isChatMode) return;
      if (event.propertyName !== "transform" && event.propertyName !== "opacity") return;
      syncHomeLayout();
    });
    if (document.fonts?.ready) {
      document.fonts.ready.then(queueHomeLayoutSync).catch(() => { });
    }
  </script>
</body>

</html>
