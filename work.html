  <script>
    /**
     * ✅ CSV 기반 로딩 방식 (탭 단위 분리 로딩)
     * - 기본 파일:
     *   /data/seed/domains.csv
     *
     * - 프로젝트 파일(권장, 탭 단위 분리):
     *   /data/seed/projects/<domain_key>.csv
     *
     * - 하위 호환(분리 파일이 없을 경우 자동 fallback):
     *   /data/seed/projects.csv
     *
     * - projects.csv 필수 컬럼:
     *   id,slug,title,summary,is_public,detail_enabled,sort_order,published_at,updated_at,thumb_url,primary_link_url,primary_link_type,domain_keys
     *
     * - domains.csv 필수 컬럼:
     *   key,label,sort_order
     */

    // ===== CSV Parser (따옴표/콤마 기본 지원) =====
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (ch === '"' && inQuotes && next === '"') { // escaped quote
          cur += '"';
          i++;
          continue;
        }
        if (ch === '"') {
          inQuotes = !inQuotes;
          continue;
        }
        if (ch === ',' && !inQuotes) {
          row.push(cur);
          cur = '';
          continue;
        }
        if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && next === '\n') i++;
          row.push(cur);
          cur = '';
          if (row.some(v => v.trim() !== '')) rows.push(row);
          row = [];
          continue;
        }
        cur += ch;
      }
      row.push(cur);
      if (row.some(v => v.trim() !== '')) rows.push(row);

      if (rows.length === 0) return [];

      const headers = rows[0].map(h => h.trim());
      return rows.slice(1).map(cols => {
        const obj = {};
        headers.forEach((h, idx) => obj[h] = (cols[idx] ?? '').trim());
        return obj;
      });
    }

    function toBool(v) {
      const s = String(v ?? '').toLowerCase();
      return s === 'true' || s === '1' || s === 'yes';
    }

    function toInt(v, fallback = 0) {
      const n = parseInt(v, 10);
      return Number.isFinite(n) ? n : fallback;
    }

    function splitDomainKeys(v) {
      if (!v) return [];
      return v.split(';').map(s => s.trim()).filter(Boolean);
    }

    function isDetailEnabled(v) {
      return String(v ?? '').trim().toLowerCase() === 'y';
    }

    // ✅ 해시 파싱: #project=slug 형태 지원
    function getProjectSlugFromHash() {
      const h = (location.hash || "").replace("#", "");
      if (!h) return "";
      const m = h.match(/(?:^|&)project=([^&]+)/);
      if (m && m[1]) return decodeURIComponent(m[1]);
      // 구버전/직접 slug만 넣은 경우(#my-slug)
      if (h && !h.includes("=")) return decodeURIComponent(h);
      return "";
    }

    function setProjectSlugToHash(slug) {
      if (!slug) return;
      const next = "#project=" + encodeURIComponent(slug);
      if (history && history.replaceState) history.replaceState(null, "", next);
      else location.hash = next;
    }

    // ===== Elements =====
    const els = {
      filtersRoot: document.getElementById('filtersRoot'),
      title: document.querySelector('[data-role="title"]'),
      desc: document.querySelector('[data-role="desc"]'),
      tags: document.querySelector('[data-role="tags"]'),
      thumb: document.querySelector('[data-role="thumb"]'),
      actions: document.querySelector('[data-role="actions"]'),
    };

    function renderProject(project, domainMap) {
      if (!project) return;

      els.title.textContent = project.title || '';
      els.desc.textContent = project.summary || '';

      // tags: domain pill
      els.tags.innerHTML = '';
      const keys = splitDomainKeys(project.domain_keys);
      keys.forEach(k => {
        const label = (domainMap.get(k) && domainMap.get(k).label) ? domainMap.get(k).label : k;
        const span = document.createElement('span');
        span.className = 'pill';
        span.textContent = label;
        els.tags.appendChild(span);
      });

      // thumb
      const thumbUrl = project.thumb_url || '';
      if (thumbUrl) {
        els.thumb.innerHTML = `<img src="${thumbUrl}" alt="${project.title || 'Project'}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;">`;
      } else {
        els.thumb.textContent = 'Project Visual';
      }

      // actions
      els.actions.innerHTML = '';
      if (isDetailEnabled(project.detail_enabled)) {
        const href = project.primary_link_url || '#';
        const linkType = (project.primary_link_type || 'detail').toLowerCase();

        const a = document.createElement('a');
        a.className = 'btn-view';
        a.href = href;
        a.textContent = '자세히 보기';

        if (linkType === 'external') {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }

        els.actions.appendChild(a);
      }

      // ✅ 딥링크/공유용 해시 반영 (보이는 내용 변경 없음)
      if (project.slug) setProjectSlugToHash(project.slug);
    }

    function setEmptyState(message) {
      els.title.textContent = '프로젝트가 없습니다';
      els.desc.textContent = message;
      els.tags.innerHTML = '';
      els.actions.innerHTML = '';
      els.thumb.textContent = 'Project Visual';
    }

    let domainMap = new Map();
    let fallbackProjectsCache = null;
    let fallbackActive = false;
    let activeProjectSlug = '';

    function normalizeProjects(projectsRaw) {
      return projectsRaw
        .filter(p => toBool(p.is_public ?? 'true'))
        .map(p => ({
          id: p.id,
          slug: p.slug,
          title: p.title,
          summary: p.summary,
          is_public: p.is_public,
          detail_enabled: p.detail_enabled,
          sort_order: p.sort_order ?? '0',
          published_at: p.published_at,
          updated_at: p.updated_at,
          thumb_url: p.thumb_url,
          primary_link_url: p.primary_link_url,
          primary_link_type: p.primary_link_type,
          domain_keys: p.domain_keys || '',
        }))
        .sort((a, b) => toInt(a.sort_order) - toInt(b.sort_order));
    }

    function setActiveProject(li, project) {
      els.filtersRoot.querySelectorAll('.filter-list li').forEach(x => x.classList.remove('is-active'));
      li.classList.add('is-active');
      activeProjectSlug = project.slug || '';
      renderProject(project, domainMap);
    }

    function readSessionCache(key) {
      try {
        return sessionStorage.getItem(key);
      } catch (e) {
        return null;
      }
    }

    function writeSessionCache(key, value) {
      try {
        sessionStorage.setItem(key, value);
      } catch (e) {
        // ignore cache errors
      }
    }

    async function fetchCSV(path, cacheKey = '') {
      if (cacheKey) {
        const cached = readSessionCache(cacheKey);
        if (cached) return cached;
      }
      const response = await fetch(path, { cache: 'no-store' });
      if (!response.ok) {
        const err = new Error(`${path} 로드 실패`);
        err.status = response.status;
        throw err;
      }
      const text = await response.text();
      if (cacheKey) writeSessionCache(cacheKey, text);
      return text;
    }

    function getDomainProjectsPath(domainKey) {
      return `data/seed/projects/${domainKey}.csv`;
    }

    async function loadDomainProjects(domainKey, domainState) {
      if (domainState.loaded || domainState.loading) return domainState.projects;
      domainState.loading = true;

      let projects = [];
      try {
        const text = await fetchCSV(getDomainProjectsPath(domainKey), `work:domain:${domainKey}`);
        projects = normalizeProjects(parseCSV(text));
      } catch (err) {
        if (err.status === 404 || err.message.includes('로드 실패')) {
          fallbackActive = true;
          if (!fallbackProjectsCache) {
            const fallbackText = await fetchCSV('data/seed/projects.csv', 'work:projects:all');
            fallbackProjectsCache = normalizeProjects(parseCSV(fallbackText));
          }
          projects = fallbackProjectsCache.filter(p => splitDomainKeys(p.domain_keys).includes(domainKey));
        } else {
          throw err;
        }
      }

      domainState.projects = projects;
      domainState.loaded = true;
      domainState.loading = false;

      return projects;
    }

    function renderDomainList(domainKey, domainState, projects, wantedSlug) {
      const ul = domainState.list;
      ul.innerHTML = '';

      if (!projects.length) {
        const empty = document.createElement('li');
        empty.textContent = '등록된 프로젝트가 없습니다.';
        empty.style.cursor = 'default';
        empty.style.color = '#94a3b8';
        ul.appendChild(empty);
        return { selected: false };
      }

      let firstProject = null;
      let firstLi = null;
      let selected = false;

      projects.forEach(p => {
        const li = document.createElement('li');
        li.dataset.projectId = p.id;
        li.dataset.projectSlug = p.slug || '';
        li.textContent = p.title || '(제목 없음)';

        if (!firstProject) {
          firstProject = p;
          firstLi = li;
        }

        li.addEventListener('click', () => setActiveProject(li, p));

        if (wantedSlug && p.slug === wantedSlug) {
          setActiveProject(li, p);
          selected = true;
        } else if (activeProjectSlug && p.slug === activeProjectSlug) {
          setActiveProject(li, p);
          selected = true;
        }

        ul.appendChild(li);
      });

      if (!selected && firstProject && firstLi) {
        setActiveProject(firstLi, firstProject);
        selected = true;
      }

      return { selected };
    }

    async function setupFilters(domains) {
      domainMap = new Map(domains.map(d => [d.key, d]));
      const sortedDomains = [...domains].sort((a, b) => toInt(a.sort_order) - toInt(b.sort_order));
      const domainStates = new Map();
      const wantedSlug = getProjectSlugFromHash();

      els.filtersRoot.innerHTML = '';

      sortedDomains.forEach((domain, idx) => {
        const details = document.createElement('details');
        details.className = 'filter-group';
        details.open = idx === 0;

        const summary = document.createElement('summary');
        summary.className = 'filter-head';
        summary.innerHTML = `${domain.label} <span>›</span>`;
        details.appendChild(summary);

        const ul = document.createElement('ul');
        ul.className = 'filter-list';
        ul.innerHTML = '<li style="cursor:default;color:#94a3b8;">탭을 열면 데이터를 불러옵니다.</li>';

        details.appendChild(ul);
        els.filtersRoot.appendChild(details);

        const state = {
          key: domain.key,
          details,
          summary,
          list: ul,
          loaded: false,
          loading: false,
          projects: [],
        };

        domainStates.set(domain.key, state);

        details.addEventListener('toggle', async () => {
          if (!details.open) return;
          if (state.loaded) return;
          ul.innerHTML = '<li style="cursor:default;color:#94a3b8;">데이터를 불러오는 중입니다...</li>';
          const projects = await loadDomainProjects(domain.key, state);
          renderDomainList(domain.key, state, projects, wantedSlug);
        });
      });

      const firstDomain = sortedDomains[0];
      if (!firstDomain) return;
      const firstState = domainStates.get(firstDomain.key);
      if (!firstState) return;

      firstState.list.innerHTML = '<li style="cursor:default;color:#94a3b8;">데이터를 불러오는 중입니다...</li>';
      const firstProjects = await loadDomainProjects(firstDomain.key, firstState);
      const selection = renderDomainList(firstDomain.key, firstState, firstProjects, wantedSlug);

      if (!selection.selected && !wantedSlug) {
        setEmptyState('is_public=true 인 프로젝트가 없거나, domain_keys 매핑이 비어 있습니다.');
      }

      if (wantedSlug && !selection.selected) {
        for (let i = 1; i < sortedDomains.length; i++) {
          const domain = sortedDomains[i];
          const state = domainStates.get(domain.key);
          if (!state) continue;
          state.list.innerHTML = '<li style="cursor:default;color:#94a3b8;">데이터를 불러오는 중입니다...</li>';
          const projects = await loadDomainProjects(domain.key, state);
          const { selected } = renderDomainList(domain.key, state, projects, wantedSlug);
          if (selected) {
            state.details.open = true;
            break;
          }
        }
        if (!activeProjectSlug) {
          setEmptyState('해당 프로젝트를 찾을 수 없습니다.');
        }
      }
    }

    async function loadData() {
      const DOMAINS_CSV = 'data/seed/domains.csv';
      const domainsText = await fetchCSV(DOMAINS_CSV, 'work:domains');

      const domainsRaw = parseCSV(domainsText);
      const domains = domainsRaw
        .filter(d => d.key && d.label)
        .map(d => ({
          key: d.key,
          label: d.label,
          sort_order: d.sort_order ?? '0',
        }));

      if (!domains.length) {
        setEmptyState('domains.csv 데이터가 비어 있습니다.');
        return;
      }

      await setupFilters(domains);

      if (fallbackActive && !fallbackProjectsCache?.length) {
        setEmptyState('is_public=true 인 프로젝트가 없거나, domain_keys 매핑이 비어 있습니다.');
      }
    }

    loadData().catch(err => {
      console.error(err);
      els.filtersRoot.innerHTML = `
        <div style="padding:14px; font-size:13px; color:#64748b; line-height:1.6;">
          데이터를 불러오지 못했습니다.<br>
          <strong>data/seed/domains.csv</strong>, <strong>data/seed/projects.csv</strong> 경로에 파일이 있는지 확인하세요.
        </div>
      `;
      els.title.textContent = '데이터 로드 실패';
      els.desc.textContent = 'CSV 경로 또는 파일명을 확인하세요.';
      els.tags.innerHTML = '';
      els.actions.innerHTML = '';
      els.thumb.textContent = 'Project Visual';
    });
  </script>
</body>
</html>
