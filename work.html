  <style>
    :root {
      --accent: #2563eb;
      --text: #1e293b; /* 전 페이지 공통 텍스트 컬러 */
      --muted: #64748b;
      --line: rgba(2, 32, 71, 0.05);
      --bg: #ffffff;
      --bg-soft: #f8fafc;

      --max: 1100px;

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", ui-sans-serif, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;

    a { color: inherit; text-decoration: none; }
    .container { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 20px; }

    /* ===== Topbar ===== */

      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,.86);
      border-bottom: 1px solid rgba(2,32,71,.08);
    }
    .topbar-inner{
      max-width: var(--max);
      margin: 0 auto;
      padding: 12px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      text-decoration:none;
      font-weight: 900;
      letter-spacing:-.4px;
      white-space:nowrap;
      color: var(--text);
    }
    .dot{
      width:10px; height:10px; border-radius: 999px;
      background: linear-gradient(180deg, rgba(49,130,246,1), rgba(27,100,218,1));
      box-shadow: 0 0 0 6px rgba(49,130,246,.14);
    }
    .topbar .nav{
      display:flex; align-items:center; gap:6px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .topbar .nav a{
      text-decoration:none;
      font-size:13px;
      color: #6b7684;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
    }
    .topbar .nav a:hover{background: rgba(2,32,71,.04); color: var(--text);}
    .topbar .nav a[aria-current="page"]{
      background:rgba(37,99,235,.10);
      color:var(--text);
      border:1px solid rgba(37,99,235,.22);
    }
    .top-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .topbar .btn{
      padding: 11px 14px;
      height: auto;
      border-radius: 14px;
      border: 1px solid rgba(2,32,71,.10);
      background: rgba(255,255,255,.92);
      color: var(--text);
      font-weight: 800;
      font-size: 14px;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(2,32,71,.08);
    }
    .topbar .btn:hover{transform: translateY(-1px);}
    .topbar .btn.primary{
      color:#fff;
      border-color: rgba(49,130,246,.22);
      background: linear-gradient(180deg, rgba(49,130,246,1), rgba(27,100,218,1));
    }

    /* ===== Main Layout (통일된 상단 여백) ===== */
    main {
      padding-top: 140px; /* 모든 상세 페이지 공통 규격 */
      padding-bottom: 110px;
      background: radial-gradient(circle at 50% 0%, rgba(37,99,235,0.03) 0%, transparent 50%);
    }

    /* ===== Section Header (Service와 규격 통일) ===== */
    .section-header { margin-bottom: 50px; text-align: left; }
    .sub-title { color: var(--accent); font-weight: 800; font-size: 13px; letter-spacing: 1.5px; margin-bottom: 16px; text-transform: uppercase; }
    .main-title { font-size: clamp(34px, 6vw, 48px); font-weight: 850; line-height: 1.1; color: #0f172a; margin: 0 0 20px; letter-spacing: -0.03em; }
    .header-desc { font-size: 18px; color: var(--muted); line-height: 1.7; max-width: 800px; margin: 0; word-break: keep-all; }

    /* ===== Work Layout ===== */
    .work-layout { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }

    /* 좌측 필터 패널 */
    .filters-panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
      min-height: 120px;
    }
    .filter-group { border: 1px solid #f1f5f9; border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
    .filter-head { padding: 14px; cursor: pointer; font-weight: 800; font-size: 14px; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
    .filter-list { list-style: none; padding: 0; margin: 0; background: #fff; }
    .filter-list li { padding: 12px 14px; font-size: 13px; font-weight: 600; color: #64748b; border-top: 1px solid #f1f5f9; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
    .filter-list li:hover { background: #f1f7ff; color: var(--accent); }
    .filter-list li.is-active { background: #eff6ff; color: var(--accent); border-left: 3px solid var(--accent); padding-left: 11px; }

    /* 우측 프로젝트 상세 패널 */

      background: #fff;
      border: 1px solid var(--line);
      border-radius: 24px;

      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);

    .thumb {
      width: 100%; aspect-ratio: 16/9; background: #f1f5f9; border-radius: 16px;
      margin-bottom: 30px; display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #cbd5e1; font-size: 20px; overflow: hidden;
      border: 1px solid var(--line);
    }
    .meta { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .pill { font-size: 12px; font-weight: 700; color: var(--accent); background: #eff6ff; padding: 4px 12px; border-radius: 100px; }

    .project-panel h2 { font-size: 32px; font-weight: 850; margin: 0 0 16px; color: #0f172a; }
    .project-panel .desc { font-size: 17px; line-height: 1.7; color: #475569; margin-bottom: 30px; word-break: keep-all; }

    .btn-view {
      display: inline-flex; align-items: center; padding: 14px 28px; background: #1e293b; color: #fff;
      border-radius: 12px; font-weight: 700; font-size: 15px; transition: 0.3s;
    }
    .btn-view:hover { background: var(--accent); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.15); }

    @media (max-width: 1024px) {
      .work-layout { grid-template-columns: 1fr; }
      .filters-panel { order: 2; }
      .project-panel { order: 1; padding: 25px; }
    }

    footer { border-top: 1px solid var(--line); padding: 40px 0; color: var(--muted); font-size: 13px; background: #fff; }
    .footer-grid { display: flex; justify-content: space-between; align-items: center; }

<body>

  <main>

      <!-- ✅ JS 미지원/렌더 실패 대비 (SEO/접근성 보조) -->

  <footer>

        <div class="nav" style="gap:15px">

  <script>
    /**
     * ✅ CSV 기반 로딩 방식
     * - 아래 파일을 사이트 경로에 배치해야 합니다.
     *   /data/seed/domains.csv
     *   /data/seed/projects.csv
     *
     * - projects.csv 필수 컬럼:
     *   id,slug,title,summary,is_public,sort_order,published_at,updated_at,thumb_url,primary_link_url,primary_link_type,domain_keys
     *
     * - domains.csv 필수 컬럼:
     *   key,label,sort_order
     */

    // ===== CSV Parser (따옴표/콤마 기본 지원) =====
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (ch === '"' && inQuotes && next === '"') { // escaped quote
          cur += '"';
          i++;
          continue;
        }
        if (ch === '"') {
          inQuotes = !inQuotes;
          continue;
        }
        if (ch === ',' && !inQuotes) {
          row.push(cur);
          cur = '';
          continue;
        }
        if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && next === '\n') i++;
          row.push(cur);
          cur = '';
          if (row.some(v => v.trim() !== '')) rows.push(row);
          row = [];
          continue;
        }
        cur += ch;
      }
      row.push(cur);
      if (row.some(v => v.trim() !== '')) rows.push(row);

      if (rows.length === 0) return [];

      const headers = rows[0].map(h => h.trim());
      return rows.slice(1).map(cols => {
        const obj = {};
        headers.forEach((h, idx) => obj[h] = (cols[idx] ?? '').trim());
        return obj;
      });
    }

    function toBool(v) {
      const s = String(v ?? '').toLowerCase();
      return s === 'true' || s === '1' || s === 'yes';
    }

    function toInt(v, fallback = 0) {
      const n = parseInt(v, 10);
      return Number.isFinite(n) ? n : fallback;
    }

    function splitDomainKeys(v) {
      if (!v) return [];
      return v.split(';').map(s => s.trim()).filter(Boolean);
    }

    // ===== Elements =====
    const els = {
      filtersRoot: document.getElementById('filtersRoot'),
      title: document.querySelector('[data-role="title"]'),
      desc: document.querySelector('[data-role="desc"]'),
      tags: document.querySelector('[data-role="tags"]'),
      thumb: document.querySelector('[data-role="thumb"]'),
      actions: document.querySelector('[data-role="actions"]'),
    };

    function renderProject(project, domainMap) {
      if (!project) return;

      els.title.textContent = project.title || '';
      els.desc.textContent = project.summary || '';

      // tags: domain pill
      els.tags.innerHTML = '';
      const keys = splitDomainKeys(project.domain_keys);
      keys.forEach(k => {
        const label = (domainMap.get(k) && domainMap.get(k).label) ? domainMap.get(k).label : k;
        const span = document.createElement('span');
        span.className = 'pill';
        span.textContent = label;
        els.tags.appendChild(span);
      });

      // thumb
      const thumbUrl = project.thumb_url || '';
      if (thumbUrl) {
        els.thumb.innerHTML = `<img src="${thumbUrl}" alt="${project.title || 'Project'}" style="width:100%;height:100%;object-fit:cover;display:block;">`;
      } else {
        els.thumb.textContent = 'Project Visual';
      }

      // actions
      els.actions.innerHTML = '';
      const href = project.primary_link_url || '#';
      const linkType = (project.primary_link_type || 'detail').toLowerCase();

      const a = document.createElement('a');
      a.className = 'btn-view';
      a.href = href;
      a.textContent = '자세히 보기';

      if (linkType === 'external') {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }

      els.actions.appendChild(a);
    }

    function renderFilters(domains, projects) {
      const domainMap = new Map(domains.map(d => [d.key, d]));

      // domainKey -> projects[]
      const projectsByDomain = new Map();
      domains.forEach(d => projectsByDomain.set(d.key, []));

      projects.forEach(p => {
        const keys = splitDomainKeys(p.domain_keys);
        keys.forEach(k => {
          if (!projectsByDomain.has(k)) projectsByDomain.set(k, []);
          projectsByDomain.get(k).push(p);
        });
      });

      // sort
      const sortedDomains = [...domains].sort((a, b) => toInt(a.sort_order) - toInt(b.sort_order));
      sortedDomains.forEach(d => {
        const arr = projectsByDomain.get(d.key) || [];
        arr.sort((a, b) => toInt(a.sort_order) - toInt(b.sort_order));
      });

      // render left
      els.filtersRoot.innerHTML = '';

      let firstProject = null;
      let firstLi = null;

      sortedDomains.forEach(domain => {
        const list = projectsByDomain.get(domain.key) || [];
        if (list.length === 0) return;

        const details = document.createElement('details');
        details.className = 'filter-group';
        details.open = true;

        const summary = document.createElement('summary');
        summary.className = 'filter-head';
        summary.innerHTML = `${domain.label} <span>›</span>`;
        details.appendChild(summary);

        const ul = document.createElement('ul');
        ul.className = 'filter-list';

        list.forEach(p => {
          const li = document.createElement('li');
          li.dataset.projectId = p.id;
          li.textContent = p.title || '(제목 없음)';

          if (!firstProject) {
            firstProject = p;
            firstLi = li;
          }

          li.addEventListener('click', () => {
            els.filtersRoot.querySelectorAll('.filter-list li').forEach(x => x.classList.remove('is-active'));
            li.classList.add('is-active');
            renderProject(p, domainMap);
          });

          ul.appendChild(li);
        });

        details.appendChild(ul);
        els.filtersRoot.appendChild(details);
      });

      // initial selection
      if (firstProject && firstLi) {
        firstLi.classList.add('is-active');
        renderProject(firstProject, domainMap);
      } else {
        els.title.textContent = '프로젝트가 없습니다';
        els.desc.textContent = 'is_public=true 인 프로젝트가 없거나, domain_keys 매핑이 비어 있습니다.';
        els.tags.innerHTML = '';
        els.actions.innerHTML = '';
        els.thumb.textContent = 'Project Visual';
      }
    }

    async function loadData() {
      // ✅ 실제 배포 시: 이 경로에 CSV를 두세요
      const DOMAINS_CSV = 'data/seed/domains.csv';
      const PROJECTS_CSV = 'data/seed/projects.csv';

      const [domainsText, projectsText] = await Promise.all([
        fetch(DOMAINS_CSV, { cache: 'no-store' }).then(r => {
          if (!r.ok) throw new Error('domains.csv 로드 실패');
          return r.text();
        }),
        fetch(PROJECTS_CSV, { cache: 'no-store' }).then(r => {
          if (!r.ok) throw new Error('projects.csv 로드 실패');
          return r.text();
        }),
      ]);

      const domainsRaw = parseCSV(domainsText);
      const projectsRaw = parseCSV(projectsText);

      const domains = domainsRaw
        .filter(d => d.key && d.label)
        .map(d => ({
          key: d.key,
          label: d.label,
          sort_order: d.sort_order ?? '0',
        }));

      const projects = projectsRaw
        .filter(p => toBool(p.is_public ?? 'true'))
        .map(p => ({
          id: p.id,
          slug: p.slug,
          title: p.title,
          summary: p.summary,
          is_public: p.is_public,
          sort_order: p.sort_order ?? '0',
          published_at: p.published_at,
          updated_at: p.updated_at,
          thumb_url: p.thumb_url,
          primary_link_url: p.primary_link_url,
          primary_link_type: p.primary_link_type,
          domain_keys: p.domain_keys || '',
        }))
        .sort((a, b) => toInt(a.sort_order) - toInt(b.sort_order));

      renderFilters(domains, projects);
    }

    loadData().catch(err => {
      console.error(err);
      els.filtersRoot.innerHTML = `
        <div style="padding:14px; font-size:13px; color:#64748b; line-height:1.6;">
          데이터를 불러오지 못했습니다.<br>
          <strong>data/seed/domains.csv</strong>, <strong>data/seed/projects.csv</strong> 경로에 파일이 있는지 확인하세요.
        </div>
      `;
      els.title.textContent = '데이터 로드 실패';
      els.desc.textContent = 'CSV 경로 또는 파일명을 확인하세요.';
      els.tags.innerHTML = '';
      els.actions.innerHTML = '';
      els.thumb.textContent = 'Project Visual';
    });
  </script>
</body>
