<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VCTTRR79QG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-VCTTRR79QG');
  </script>
  <title>TV Voice 활용 UX 리서치 | GROWTHLINE</title>
  <meta name="description" content="TV 환경에서의 음성 인터랙션 UX 리서치 사례를 소개합니다." />
  <link rel="canonical" href="detail.html" />

  <style>
    :root{
      --accent:#2563eb;
      --text:#1e293b; /* 조금 더 부드러운 다크 네이비로 변경 */
      --muted:#64748b;
      --line:rgba(2,6,23,.08);
      --bg:#ffffff;
      --bg-soft:#f8fafc;
      --card:#ffffff;

      --radius:24px; /* 다른 페이지와 맞추어 곡률 증가 */
      --max:1100px; /* 상담 페이지 카드 너비와 통일 */
      --pad:clamp(20px,5vw,40px);

      --h1:clamp(32px,5vw,48px); /* 너무 과하지 않은 헤드라인 크기 */
      --h2:clamp(24px,4vw,30px);
      --shadow-md:0 20px 40px rgba(15,23,42,.05);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: 'Pretendard', ui-sans-serif, system-ui, -apple-system, sans-serif;
      color:var(--text);
      background:var(--bg);
      -webkit-font-smoothing:antialiased;
      line-height: 1.6;
    }
    a{color:inherit;text-decoration:none}
    .container{width:100%;max-width:var(--max);margin:0 auto;padding:0 var(--pad)}

    /* --- Header --- */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,.86);
      border-bottom: 1px solid rgba(2,32,71,.08);
    }
    .topbar-inner{
      max-width: var(--max);
      margin: 0 auto;
      padding: 12px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      text-decoration:none;
      font-weight: 900;
      letter-spacing:-.4px;
      white-space:nowrap;
      color: var(--text);
    }
    .dot{
      width:10px; height:10px; border-radius: 999px;
      background: linear-gradient(180deg, rgba(49,130,246,1), rgba(27,100,218,1));
      box-shadow: 0 0 0 6px rgba(49,130,246,.14);
    }
    .topbar .nav{
      display:flex; align-items:center; gap:6px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .topbar .nav a{
      text-decoration:none;
      font-size:13px;
      color: #6b7684;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
    }
    .topbar .nav a:hover{background: rgba(2,32,71,.04); color: var(--text);}
    .topbar .nav a[aria-current="page"]{
      background:rgba(37,99,235,.10);
      color:var(--text);
      border:1px solid rgba(37,99,235,.22);
    }
    .top-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .topbar .btn{
      padding: 11px 14px;
      height: auto;
      border-radius: 14px;
      border: 1px solid rgba(2,32,71,.10);
      background: rgba(255,255,255,.92);
      color: var(--text);
      font-weight: 800;
      font-size: 14px;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(2,32,71,.08);
    }
    .topbar .btn:hover{transform: translateY(-1px);}
    .topbar .btn.primary{
      color:#fff;
      border-color: rgba(49,130,246,.22);
      background: linear-gradient(180deg, rgba(49,130,246,1), rgba(27,100,218,1));
    }



    /* --- Main Layout (통일성 핵심) --- */
    main {
      padding-top: 80px; /* 상단 헤더와의 일정한 간격 확보 */
      padding-bottom: 100px;
      background: radial-gradient(circle at 50% 0%, rgba(37,99,235,0.03) 0%, transparent 50%);
    }

    /* --- Hero Section --- */
    .hero { margin-bottom: 60px; }
    h1 {
      margin: 0 0 20px;
      font-size: var(--h1);
      letter-spacing: -0.03em;
      font-weight: 850;
      line-height: 1.2;
      color: #0f172a;
    }
    .lead {
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
      max-width: 800px;
      word-break: keep-all;
    }
    .hero-actions { display: flex; gap: 12px; }
    
    /* 버튼 스타일 조정 */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 14px 24px; border-radius: 12px; font-size: 15px; font-weight: 700;
      transition: 0.3s; cursor: pointer; border: 1px solid #e2e8f0;
      background: #fff; color: #475569;
    }
    .btn.primary { background: #1e293b; color: #fff; border: none; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

    /* --- Detail Content (Grid) --- */
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 40px; /* 내부 여백 확장 */
      box-shadow: var(--shadow-md);
    }
    .meta { display: flex; gap: 8px; margin-bottom: 20px; }
    .pill {
      padding: 6px 12px; border-radius: 6px; background: #f1f5f9;
      color: #64748b; font-size: 12px; font-weight: 700; text-transform: uppercase;
    }
    
    h2 {
      margin: 0 0 16px;
      font-size: var(--h2);
      font-weight: 800;
      color: #1e293b;
    }
    
    ul { margin: 0; padding-left: 20px; color: #475569; }
    ul li { margin-bottom: 12px; font-size: 16px; line-height: 1.6; }
    ul li::marker { color: var(--accent); }

    @media (max-width: 768px) {
      main { padding-top: 100px; }
      .card { padding: 30px 20px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html" aria-label="홈으로">
        <span class="dot" aria-hidden="true"></span>
        <span>GROWTHLINE</span>
      </a>
      <div class="top-actions">
        <nav class="nav" aria-label="상단 메뉴">
          <a href="service.html">service</a>
          <a href="work.html" aria-current="page">work</a>
        </nav>
        <a class="btn primary" href="contact.html">진단받기</a>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="hero">
        <h1>TV Voice 활용 UX 리서치</h1>
        <p class="lead">TV 환경에서 음성 인터랙션을 사용하는 고객 여정과 니즈를 파악하고, 발화 및 피드백 정책을 설계한 실제 사례를 소개합니다.</p>
        <div class="hero-actions">
          <a class="btn" href="work.html">← 목록으로 돌아가기</a>
        </div>
      </section>

      <section class="detail-grid" data-role="detail-content">
        <div class="card">
          <p class="lead" style="font-size:16px; margin-bottom:0;">
            상세 내용을 불러오는 중입니다.
          </p>
        </div>
      </section>
    </div>
  </main>
  <script>
    function getSlugFromQuery() {
      const params = new URLSearchParams(location.search);
      const slug = params.get('slug');
      if (slug) return slug;
      const hash = (location.hash || '').replace('#', '');
      if (hash) return hash;
      const pathParts = location.pathname.split('/').filter(Boolean);
      const last = pathParts[pathParts.length - 1];
      if (last && last.endsWith('.html')) return '';
      return last || '';
    }

    async function loadDetailContent() {
      const container = document.querySelector('[data-role="detail-content"]');
      if (!container) return;
      const slug = getSlugFromQuery();
      if (!slug) {
        container.innerHTML = `
          <div class="card">
            <p class="lead" style="font-size:16px; margin-bottom:0;">
              상세 내용을 보려면 올바른 프로젝트 링크로 이동하세요.
            </p>
          </div>
        `;
        return;
      }

      try {
        const response = await fetch(`data/projects/${slug}.html`, { cache: 'no-store' });
        if (!response.ok) throw new Error('상세 파일 로드 실패');
        const html = await response.text();
        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = `
          <div class="card">
            <p class="lead" style="font-size:16px; margin-bottom:0;">
              상세 내용을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.
            </p>
          </div>
        `;
      }
    }

    loadDetailContent();
  </script>
</body>
</html>
