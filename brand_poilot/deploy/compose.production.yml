name: brand-pilot

services:
  api-primary:
    image: ${PRIMARY_API_IMAGE:-${API_IMAGE:?API_IMAGE is required}}
    env_file:
      - ${API_ENV_FILE:-/opt/brand-pilot/shared/env/api.env}
    environment:
      LOCAL_SCHEDULER_ENABLED: "false"
      INSTAGRAM_PUBLISH_ENABLED: "false"
      AI_CONTENT_ATTACHMENT_UPLOAD_SESSIONS_ENABLED: "false"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "4000"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api-canary:
    image: ${CANDIDATE_API_IMAGE:-${API_IMAGE:?API_IMAGE is required}}
    env_file:
      - ${API_ENV_FILE:-/opt/brand-pilot/shared/env/api.env}
    environment:
      LOCAL_SCHEDULER_ENABLED: "false"
      INSTAGRAM_PUBLISH_ENABLED: "false"
      AI_CONTENT_ATTACHMENT_UPLOAD_SESSIONS_ENABLED: "false"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "4000"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  dm-worker-1:
