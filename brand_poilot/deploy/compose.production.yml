name: brand-pilot

services:
  api-primary:
    image: ${PRIMARY_API_IMAGE:-${API_IMAGE:?API_IMAGE is required}}
    env_file:
      - ${API_ENV_FILE:-/opt/brand-pilot/shared/env/api.env}
    environment:
      LOCAL_SCHEDULER_ENABLED: "false"
      INSTAGRAM_PUBLISH_ENABLED: "false"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "4000"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api-canary:
    image: ${CANDIDATE_API_IMAGE:-${API_IMAGE:?API_IMAGE is required}}
    env_file:
      - ${API_ENV_FILE:-/opt/brand-pilot/shared/env/api.env}
    environment:
      LOCAL_SCHEDULER_ENABLED: "false"
      INSTAGRAM_PUBLISH_ENABLED: "false"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "4000"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    environment:
      CANARY_HOST: ${CANARY_HOST:?CANARY_HOST is required}
      PRIMARY_HOST: ${PRIMARY_HOST:?PRIMARY_HOST is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
