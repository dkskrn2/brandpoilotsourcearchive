      - ${DM_WORKER_1_ENV_FILE:-/opt/brand-pilot/shared/env/dm-worker-1.env}
    environment:
      CODEX_HOME: /codex
      WORKER_ID: dm-worker-1
      WORKER_MODE: dm
    user: "${CODEX_RUNTIME_UID:?CODEX_RUNTIME_UID is required}:${CODEX_RUNTIME_GID:?CODEX_RUNTIME_GID is required}"
    restart: unless-stopped
    init: true
    read_only: true
    volumes:
      - ${CODEX_HOME_PATH:-/opt/brand-pilot/shared/codex}:/codex
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor:runc
      - seccomp:unconfined
      - systempaths:unconfined
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

