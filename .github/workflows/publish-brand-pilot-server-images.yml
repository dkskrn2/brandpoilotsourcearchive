name: Publish Brand Pilot server images

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "brand_poilot/**"
      - ".github/workflows/publish-brand-pilot-server-images.yml"
  push:
    branches: [main]
    paths:
      - "brand_poilot/**"
      - ".github/workflows/publish-brand-pilot-server-images.yml"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  PRODUCTION_RELEASE_SHA: ${{ vars.PRODUCTION_RELEASE_SHA }}

jobs:
  impact:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.impact.outputs.matrix }}
      components: ${{ steps.impact.outputs.components }}
      migration_changed: ${{ steps.impact.outputs.migration_changed }}
      production_deploy_allowed: ${{ steps.impact.outputs.production_deploy_allowed }}
      server_changed: ${{ steps.impact.outputs.server_changed }}
      deploy_bundle_changed: ${{ steps.impact.outputs.deploy_bundle_changed }}
      ui_changed: ${{ steps.impact.outputs.ui_changed }}
      bootstrap: ${{ steps.impact.outputs.bootstrap }}
      policy_base_sha: ${{ steps.impact.outputs.policy_base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # The impact job fetches the private base branch (PR) or current main
          # (release). Keep the job's read-only contents token available only
          # for this checkout; build and publish jobs still discard it.
          persist-credentials: true

      - name: Verify release ancestry and current main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "main_release_required" >&2; exit 1; }
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo "stale_main_release" >&2; exit 1; }
          if [[ -n "$PRODUCTION_RELEASE_SHA" ]]; then
            [[ "$PRODUCTION_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "production_release_sha_invalid" >&2; exit 1; }
            git cat-file -e "${PRODUCTION_RELEASE_SHA}^{commit}"
            git merge-base --is-ancestor "$PRODUCTION_RELEASE_SHA" "$GITHUB_SHA" || {
              echo "candidate_not_descendant_of_production" >&2
              exit 1
            }
          fi

      - name: Detect affected components
        id: impact
        working-directory: brand_poilot
        shell: bash
        env:
          SCHEMA2_READY: ${{ vars.PRODUCTION_RELEASE_SCHEMA2_READY }}
        run: |
          set -Eeuo pipefail
          policy_base_sha=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            base_sha="$(git merge-base "origin/$GITHUB_BASE_REF" "$GITHUB_SHA")"
            policy_base_sha="$base_sha"
            scoped_impact_json="$(node scripts/release-impact.mjs --base "$base_sha" --head "$GITHUB_SHA" --profile manual-brand-visual-assets)"
            if IMPACT_JSON="$scoped_impact_json" node --input-type=module -e '
              const impact = JSON.parse(process.env.IMPACT_JSON);
              process.exit(impact.verifiedScope ? 0 : 1);
            '; then
              impact_json="$scoped_impact_json"
            else
              faq_impact_json="$(node scripts/release-impact.mjs --base "$base_sha" --head "$GITHUB_SHA" --profile faq-utterance-matching)"
              if IMPACT_JSON="$faq_impact_json" node --input-type=module -e '
                const impact = JSON.parse(process.env.IMPACT_JSON);
                process.exit(impact.verifiedScope ? 0 : 1);
              '; then
                impact_json="$faq_impact_json"
              else
                scoped_impact_json="$(node scripts/release-impact.mjs --base "$base_sha" --head "$GITHUB_SHA" --profile card-manuscript-visual-session)"
                if IMPACT_JSON="$scoped_impact_json" node --input-type=module -e '
                  const impact = JSON.parse(process.env.IMPACT_JSON);
                  process.exit(impact.verifiedScope && impact.productionDeployAllowed ? 0 : 1);
                '; then
                  impact_json="$scoped_impact_json"
                else
                  impact_json="$(node scripts/release-impact.mjs --base "$base_sha" --head "$GITHUB_SHA")"
                fi
              fi
            fi
            bootstrap=false
          elif [[ -z "$PRODUCTION_RELEASE_SHA" || "$SCHEMA2_READY" != "true" ]]; then
            impact_json="$(node --input-type=module -e 'import { classifyChangedPaths } from "./scripts/release-impact.mjs"; console.log(JSON.stringify(classifyChangedPaths(["package-lock.json"])))')"
            bootstrap=true
          else
            policy_base_sha="$PRODUCTION_RELEASE_SHA"
            scoped_impact_json="$(node scripts/release-impact.mjs --base "$PRODUCTION_RELEASE_SHA" --head "$GITHUB_SHA" --profile manual-brand-visual-assets)"
            if IMPACT_JSON="$scoped_impact_json" node --input-type=module -e '
                const impact = JSON.parse(process.env.IMPACT_JSON);
                process.exit(impact.verifiedScope ? 0 : 1);
              '; then
                impact_json="$scoped_impact_json"
              else
                faq_impact_json="$(node scripts/release-impact.mjs --base "$PRODUCTION_RELEASE_SHA" --head "$GITHUB_SHA" --profile faq-utterance-matching)"
                if IMPACT_JSON="$faq_impact_json" node --input-type=module -e '
                  const impact = JSON.parse(process.env.IMPACT_JSON);
                  process.exit(impact.verifiedScope ? 0 : 1);
                '; then
                  impact_json="$faq_impact_json"
                else
                  scoped_impact_json="$(node scripts/release-impact.mjs --base "$PRODUCTION_RELEASE_SHA" --head "$GITHUB_SHA" --profile card-manuscript-visual-session)"
                  if IMPACT_JSON="$scoped_impact_json" node --input-type=module -e '
                    const impact = JSON.parse(process.env.IMPACT_JSON);
                    process.exit(impact.verifiedScope && impact.productionDeployAllowed ? 0 : 1);
                  '; then
                    impact_json="$scoped_impact_json"
                  else
                    impact_json="$(node scripts/release-impact.mjs --base "$PRODUCTION_RELEASE_SHA" --head "$GITHUB_SHA")"
                  fi
                fi
              fi
            bootstrap=false
          fi
          IMPACT_JSON="$impact_json" node --input-type=module <<'NODE' > impact.outputs
          const impact = JSON.parse(process.env.IMPACT_JSON);
          const specs = [
            { component: "api", dockerfile: "apps/api/Dockerfile", imageKeys: ["API_IMAGE"], repositories: ["brand-pilot-api"] },
            { component: "dmWikiWorker", dockerfile: "workers/brand-pilot-dm-worker/Dockerfile", imageKeys: ["DM_WORKER_IMAGE", "WIKI_WORKER_IMAGE"], repositories: ["brand-pilot-dm-worker", "brand-pilot-wiki-worker"] },
            { component: "contentProposalWorker", dockerfile: "workers/brand-pilot-content-proposal-worker/Dockerfile", imageKeys: ["CONTENT_PROPOSAL_WORKER_IMAGE"], repositories: ["brand-pilot-content-proposal-worker"] },
            { component: "brandIntelligenceWorker", dockerfile: "workers/brand-pilot-brand-intelligence-worker/Dockerfile", imageKeys: ["BRAND_INTELLIGENCE_WORKER_IMAGE"], repositories: ["brand-pilot-brand-intelligence-worker"] },
            { component: "subjectAnalysisWorker", dockerfile: "workers/brand-pilot-subject-analysis-worker/Dockerfile", imageKeys: ["SUBJECT_ANALYSIS_WORKER_IMAGE"], repositories: ["brand-pilot-subject-analysis-worker"] },
            { component: "imageWorker", dockerfile: "workers/brand-pilot-image-worker/Dockerfile", imageKeys: ["IMAGE_WORKER_IMAGE"], repositories: ["brand-pilot-image-worker"] },
            { component: "cardNewsWorker", dockerfile: "workers/brand-pilot-card-news-worker/Dockerfile", imageKeys: ["CARD_NEWS_WORKER_IMAGE"], repositories: ["brand-pilot-card-news-worker"] },
            { component: "blogWorker", dockerfile: "workers/brand-pilot-blog-worker/Dockerfile", imageKeys: ["BLOG_WORKER_IMAGE"], repositories: ["brand-pilot-blog-worker"] },
            { component: "reelWorker", dockerfile: "workers/brand-pilot-reel-worker/Dockerfile", imageKeys: ["REEL_WORKER_IMAGE"], repositories: ["brand-pilot-reel-worker"] },
          ];
          const include = specs.filter((entry) => impact.components[entry.component]);
          const out = {
            matrix: JSON.stringify({ include }),
            components: JSON.stringify(impact.components),
            migration_changed: String(impact.migrationChanged),
            production_deploy_allowed: String(impact.productionDeployAllowed),
            server_changed: String(include.length > 0),
            deploy_bundle_changed: String(impact.deployBundleChanged),
            ui_changed: String(impact.components.customerUi),
          };
          for (const [key, value] of Object.entries(out)) console.log(`${key}=${value}`);
          NODE
          cat impact.outputs >> "$GITHUB_OUTPUT"
          printf 'bootstrap=%s\n' "$bootstrap" >> "$GITHUB_OUTPUT"
          printf 'policy_base_sha=%s\n' "$policy_base_sha" >> "$GITHUB_OUTPUT"

  verify:
    needs: impact
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: brand_poilot/package-lock.json
      - name: Install
        working-directory: brand_poilot
        run: npm ci
      - name: Verify canonical visual render policy release history
        working-directory: brand_poilot
        env:
          POLICY_BASE_SHA: ${{ needs.impact.outputs.policy_base_sha }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$POLICY_BASE_SHA" ]]; then
            node scripts/verify-ai-content-visual-render-policy.mjs --base "$POLICY_BASE_SHA"
          else
            node scripts/verify-ai-content-visual-render-policy.mjs
          fi
      - name: Verify release tooling and deployment contracts
        working-directory: brand_poilot
        run: |
          node --test scripts/release-impact.test.mjs
          node --test scripts/assemble-release-manifest.test.mjs
          node --test scripts/incremental-cicd-contract.test.mjs
          npm run test:contract
          npm run test:deployment
          shellcheck --exclude=SC1091,SC2016,SC2034,SC2317 deploy/scripts/*.sh
      - name: Verify migrations
        if: needs.impact.outputs.migration_changed == 'true'
        working-directory: brand_poilot
        run: |
          node --test scripts/migrate.test.mjs
          node --test scripts/migrationRunner.test.mjs
          node --test scripts/ai-content-three-format-cutover.postgres.integration.test.mjs
          AI_CONTENT_074_ENFORCE_BENCHMARK=false node --test scripts/ai-content-074.postgres.integration.test.mjs
          npm run test:migrations
          npm exec --workspace @brand-pilot/api -- vitest run src/publishCalendarMigration086.postgres.integration.test.ts
          echo "migration_approval_required"
      - name: Verify API
        if: fromJSON(needs.impact.outputs.components).api
        working-directory: brand_poilot
        run: |
          npm run pretest --workspace @brand-pilot/api
          npm exec --workspace @brand-pilot/api -- vitest run \
            src/aiContentFixedInputAssembler.test.ts \
            src/aiContentGenerationInput.test.ts \
            src/aiContentGenerationInputV3.test.ts \
            src/aiContentGenerationOperations.test.ts \
            src/aiContentMaintenance.test.ts \
            src/aiContentManifest.test.ts \
            src/aiContentMigration075.test.ts \
            src/aiContentPlanContracts.test.ts \
            src/aiContentProposalV2Service.test.ts \
            src/aiContentPublish.test.ts \
            src/aiContentPublishTargets.test.ts \
            src/aiContentRenderJobs.test.ts \
            src/aiContentRepositoryV3BoundaryContracts.test.ts \
            src/aiContentRepositoryV3Contracts.test.ts \
            src/aiContentRepositoryV3Retry.test.ts \
            src/aiContentRepositoryV3Runtime.test.ts \
            src/aiContentRepositoryV3Start.test.ts \
            src/aiContentSeedResolver.test.ts \
            src/aiContentUpload.test.ts \
            src/contentOrchestration.test.ts \
            src/contentProposalJobs.test.ts \
            src/publishCalendarIdempotency.test.ts \
            src/publishCalendarRepository.test.ts \
            src/publishCalendarProvisioning.pglite.test.ts \
            src/publishCalendarMigration086.pglite.test.ts \
            src/publishCalendarAllocator.test.ts \
            src/publishItemsRepository.test.ts \
            src/publishItemsRepository.pglite.test.ts \
            src/publishItemState.test.ts \
            src/publishSchedule.test.ts \
            src/repository.aiContentPool.test.ts \
            src/repository.dmWiki.test.ts \
            src/server.aiContentCustomer.test.ts \
            src/server.aiContentRenderWorker.test.ts \
            src/server.aiContentV2Customer.test.ts \
            src/server.aiContentWorker.test.ts \
            src/server.contentProposalWorker.test.ts \
            --maxWorkers=4
          npm exec --workspace @brand-pilot/api -- vitest run \
            src/repository.test.ts --testNamePattern "Task 4 transactional topic generation|Task 11 topic publish group scheduling|preserves non-reservation recovery, lease, and provider retry timing|composes the tenant-scoped canonical publish items repository" \
            --maxWorkers=1
          npm exec --workspace @brand-pilot/api -- vitest run \
            src/server.test.ts --testNamePattern "scopes calendar routes|returns canonical publish items|requires authentication and brand access before listing canonical publish items|removes the legacy no-key calendar slot creation route|returns brand-scoped authoritative manual calendar options|lists scoped calendar content candidates|provisions a content-backed manual slot|provisions a validated manual slot batch|returns a conflict when a manual batch exceeds the plan generation quota" \
            --maxWorkers=1
          npm run build --workspace @brand-pilot/api
      - name: Verify customer UI
        if: fromJSON(needs.impact.outputs.components).customerUi
        working-directory: brand_poilot
        env:
          TZ: Asia/Seoul
        run: |
          npm run test --workspace @brand-pilot/customer-ui
          npm run build --workspace @brand-pilot/customer-ui
      - name: Verify DM and Wiki worker
        if: fromJSON(needs.impact.outputs.components).dmWikiWorker
        working-directory: brand_poilot
        run: npm run test --workspace @brand-pilot/dm-worker && npm run build --workspace @brand-pilot/dm-worker
      - name: Verify content proposal worker
        if: fromJSON(needs.impact.outputs.components).contentProposalWorker
        working-directory: brand_poilot
        run: npm run test --workspace @brand-pilot/content-proposal-worker && npm run build --workspace @brand-pilot/content-proposal-worker
      - name: Verify brand intelligence worker
        if: fromJSON(needs.impact.outputs.components).brandIntelligenceWorker
        working-directory: brand_poilot
        run: npm run test --workspace @brand-pilot/brand-intelligence-worker && npm run build --workspace @brand-pilot/brand-intelligence-worker
      - name: Verify subject analysis worker
        if: fromJSON(needs.impact.outputs.components).subjectAnalysisWorker
        working-directory: brand_poilot
        run: npm run test --workspace @brand-pilot/subject-analysis-worker && npm run build --workspace @brand-pilot/subject-analysis-worker
      - name: Verify image worker
        if: fromJSON(needs.impact.outputs.components).imageWorker
        working-directory: brand_poilot
        run: npm run test --workspace @brand-pilot/image-worker && npm run build --workspace @brand-pilot/image-worker
      - name: Verify card-news worker
        if: fromJSON(needs.impact.outputs.components).cardNewsWorker
        working-directory: brand_poilot
        run: npm run test --workspace @brand-pilot/card-news-worker && npm run build --workspace @brand-pilot/card-news-worker
      - name: Verify blog worker
        if: fromJSON(needs.impact.outputs.components).blogWorker
        working-directory: brand_poilot
        run: npm run test --workspace @brand-pilot/blog-worker && npm run build --workspace @brand-pilot/blog-worker
      - name: Verify reel worker
        if: fromJSON(needs.impact.outputs.components).reelWorker
        working-directory: brand_poilot
        run: npm run test --workspace @brand-pilot/reel-worker && npm run build --workspace @brand-pilot/reel-worker

  publish:
    needs: [impact, verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.impact.outputs.server_changed == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.impact.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute immutable tags
        id: tags
        shell: bash
        env:
          REPOSITORIES_JSON: ${{ toJSON(matrix.repositories) }}
        run: |
          set -Eeuo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo 'value<<EOF'
            jq -r '.[]' <<<"$REPOSITORIES_JSON" | while read -r repository; do
              [[ "$repository" =~ ^[a-z0-9-]+$ ]]
              printf 'ghcr.io/%s/%s:sha-%s\n' "$owner" "$repository" "$GITHUB_SHA"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build and push affected image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: brand_poilot
          file: brand_poilot/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Record component digests
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE_KEYS_JSON="$IMAGE_KEYS_JSON" REPOSITORIES_JSON="$REPOSITORIES_JSON" IMAGE_DIGEST="$IMAGE_DIGEST" node <<'NODE'
          const keys = JSON.parse(process.env.IMAGE_KEYS_JSON);
          const repositories = JSON.parse(process.env.REPOSITORIES_JSON);
          if (keys.length !== repositories.length) throw new Error("component_metadata_mismatch");
          const owner = process.env.GITHUB_REPOSITORY_OWNER.toLowerCase();
          const result = Object.fromEntries(keys.map((key, index) => [key, {
            image: `ghcr.io/${owner}/${repositories[index]}@${process.env.IMAGE_DIGEST}`,
            sourceSha: process.env.GITHUB_SHA,
          }]));
          require("node:fs").writeFileSync(`built-${process.env.MATRIX_COMPONENT}.json`, `${JSON.stringify(result)}\n`);
          NODE
        env:
          IMAGE_KEYS_JSON: ${{ toJSON(matrix.imageKeys) }}
          REPOSITORIES_JSON: ${{ toJSON(matrix.repositories) }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          MATRIX_COMPONENT: ${{ matrix.component }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brand-pilot-image-${{ matrix.component }}-${{ github.sha }}
          path: built-${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 30

  manifest:
    needs: [impact, verify, publish]
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && (needs.impact.outputs.server_changed == 'true' || needs.impact.outputs.deploy_bundle_changed == 'true') }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.impact.outputs.server_changed == 'true'
        with:
          pattern: brand-pilot-image-*-${{ github.sha }}
          path: brand_poilot/built-images
          merge-multiple: true
      - name: Resolve current production manifest
        if: needs.impact.outputs.bootstrap != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$PRODUCTION_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          artifact_id=""
          artifact_source=""
          recovery_run_id=""
          recovery_workflow_head_sha=""
          while read -r run_id; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || continue
            trusted_run_head_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              --jq 'if .conclusion == "success" and .event == "workflow_dispatch" and .head_branch == "main" and .path == ".github/workflows/recover-brand-pilot-production-baseline.yml" then .head_sha else "" end')"
            [[ "$trusted_run_head_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq ".artifacts[] | select(.expired == false and .name == \"brand-pilot-release-$PRODUCTION_RELEASE_SHA\") | .id" | head -n1)"
            if [[ "$artifact_id" =~ ^[0-9]+$ ]]; then
              artifact_source="recovery"
              recovery_run_id="$run_id"
              recovery_workflow_head_sha="$trusted_run_head_sha"
              break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/recover-brand-pilot-production-baseline.yml/runs?status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success" and .path == ".github/workflows/recover-brand-pilot-production-baseline.yml") | .id')
          if [[ -z "$artifact_id" ]]; then
            while read -r run_id; do
              [[ "$run_id" =~ ^[0-9]+$ ]] || continue
              artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq ".artifacts[] | select(.expired == false and .name == \"brand-pilot-release-$PRODUCTION_RELEASE_SHA\") | .id" | head -n1)"
              if [[ "$artifact_id" =~ ^[0-9]+$ ]]; then
                artifact_source="publish"
                break
              fi
            done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-brand-pilot-server-images.yml/runs?head_sha=$PRODUCTION_RELEASE_SHA&status=success&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "success") | .id')
          fi
          [[ "$artifact_id" =~ ^[0-9]+$ ]] || { echo "production_manifest_artifact_missing" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > current-release.zip
          unzip -q current-release.zip -d current-release
          if [[ "$artifact_source" == "recovery" ]]; then
            PRODUCTION_RELEASE_SHA="$PRODUCTION_RELEASE_SHA" RECOVERY_RUN_ID="$recovery_run_id" RECOVERY_WORKFLOW_HEAD_SHA="$recovery_workflow_head_sha" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const fail = () => { console.error("production_manifest_recovery_provenance_invalid"); process.exit(1); };
          let provenance;
          try { provenance = JSON.parse(readFileSync("current-release/baseline-recovery-provenance.json", "utf8")); } catch { fail(); }
          const bundlePath = `current-release/release-bundle-${process.env.PRODUCTION_RELEASE_SHA}.tar.gz`;
          const bundleSha256 = createHash("sha256").update(readFileSync(bundlePath)).digest("hex");
          const integritySha256 = createHash("sha256").update(readFileSync("current-release/release-integrity.sha256")).digest("hex");
          const keys = Object.keys(provenance ?? {}).sort().join(",");
          const expectedKeys = ["apiDigest","contractVersion","releaseBundleSha256","releaseEnvSha256","releaseIntegritySha256","releaseSha","sourceWorkflow","workflowHeadSha","workflowRunId"].sort().join(",");
          if (keys !== expectedKeys
            || provenance.contractVersion !== "brand-pilot-baseline-recovery.v1"
            || provenance.sourceWorkflow !== ".github/workflows/recover-brand-pilot-production-baseline.yml"
            || provenance.workflowRunId !== process.env.RECOVERY_RUN_ID
            || provenance.workflowHeadSha !== process.env.RECOVERY_WORKFLOW_HEAD_SHA
            || provenance.releaseSha !== process.env.PRODUCTION_RELEASE_SHA
            || provenance.releaseBundleSha256 !== bundleSha256
            || provenance.releaseIntegritySha256 !== integritySha256
            || !/^sha256:[0-9a-f]{64}$/.test(provenance.apiDigest)
            || !/^[0-9a-f]{64}$/.test(provenance.releaseEnvSha256)) fail();
          NODE
          fi
          (
            cd current-release
            sha256sum --check "release-bundle-$PRODUCTION_RELEASE_SHA.tar.gz.sha256"
            tar -xzf "release-bundle-$PRODUCTION_RELEASE_SHA.tar.gz"
          )
          grep -Fx 'RELEASE_SCHEMA=3' current-release/release.env
          grep -Fx "RELEASE_SHA=$PRODUCTION_RELEASE_SHA" current-release/release.env
          if [[ "$artifact_source" == "recovery" ]]; then
            release_env_sha256="$(sha256sum -- current-release/release.env | awk '{print $1}')"
            provenance_release_env_sha256="$(jq -r '.releaseEnvSha256' current-release/baseline-recovery-provenance.json)"
            [[ "$release_env_sha256" == "$provenance_release_env_sha256" ]] || { echo "production_manifest_recovery_provenance_invalid" >&2; exit 1; }
            provenance_api_digest="$(jq -r '.apiDigest' current-release/baseline-recovery-provenance.json)"
            grep -Eq "^API_IMAGE=[^[:space:]]+@$provenance_api_digest$" current-release/release.env || { echo "production_manifest_recovery_provenance_invalid" >&2; exit 1; }
          fi
          cp "current-release/release.env" brand_poilot/current-release.env
      - name: Assemble immutable release bundle
        working-directory: brand_poilot
        shell: bash
        env:
          BOOTSTRAP: ${{ needs.impact.outputs.bootstrap }}
        run: |
          set -Eeuo pipefail
          mkdir -p built-images
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, writeFileSync } from "node:fs";
          import { assembleReleaseManifest } from "./scripts/assemble-release-manifest.mjs";
          const builtImages = {};
          for (const file of readdirSync("built-images").filter((name) => name.endsWith(".json")).sort()) {
            Object.assign(builtImages, JSON.parse(readFileSync(`built-images/${file}`, "utf8")));
          }
          const currentManifest = process.env.BOOTSTRAP === "true" ? null : readFileSync("current-release.env", "utf8");
          const caddy = readFileSync("deploy/caddy-image.env", "utf8").trim().split("=")[1];
          const release = assembleReleaseManifest({
            releaseSha: process.env.GITHUB_SHA,
            currentManifest,
            builtImages,
            changedImageKeys: Object.keys(builtImages),
            staticValues: {
              CADDY_IMAGE: caddy,
              CANARY_HOST: "canary-api.danbammsg.co.kr",
              PRIMARY_HOST: "api.danbammsg.co.kr",
              ACME_EMAIL: "ops@danbammsg.co.kr",
              API_ENV_FILE: "/opt/brand-pilot/shared/env/api.env",
            },
          });
          writeFileSync("release.env", release, { mode: 0o600 });
          NODE
          grep -Fx 'RELEASE_SCHEMA=3' release.env
          sha256sum release.env > release.env.sha256
          tar -czf "release-bundle-$GITHUB_SHA.tar.gz" deploy release.env release.env.sha256
          sha256sum "release-bundle-$GITHUB_SHA.tar.gz" > "release-bundle-$GITHUB_SHA.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brand-pilot-release-${{ github.sha }}
          path: |
            brand_poilot/release-bundle-${{ github.sha }}.tar.gz
            brand_poilot/release-bundle-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: [impact, manifest]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.BRAND_PILOT_CD_ENABLED == 'true' && needs.impact.outputs.production_deploy_allowed == 'true'
    permissions:
      actions: read
      contents: read
    environment: Production
    concurrency:
      group: brand-pilot-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - name: Verify production deployment credentials
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BRAND_PILOT_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.BRAND_PILOT_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.BRAND_PILOT_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.BRAND_PILOT_DEPLOY_KNOWN_HOSTS }}
          CANARY_SESSION_COOKIE: ${{ secrets.CANARY_SESSION_COOKIE }}
          CANARY_BRAND_ID: ${{ secrets.CANARY_BRAND_ID }}
        run: |
          set -Eeuo pipefail
          for value in "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_SSH_KEY" "$DEPLOY_KNOWN_HOSTS" "$CANARY_SESSION_COOKIE" "$CANARY_BRAND_ID"; do
            [[ -n "$value" ]] || { echo "cd_credentials_missing" >&2; exit 1; }
          done
          echo "production_deploy_handoff_requires_provider_backup_approval"
          exit 1
