name: Publish Brand Pilot server images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "brand_poilot/**"
      - ".github/workflows/publish-brand-pilot-server-images.yml"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository_owner }}/brand-pilot-api
  DM_WORKER_IMAGE_NAME: ${{ github.repository_owner }}/brand-pilot-dm-worker
  WIKI_WORKER_IMAGE_NAME: ${{ github.repository_owner }}/brand-pilot-wiki-worker
  CONTENT_PROPOSAL_WORKER_IMAGE_NAME: ${{ github.repository_owner }}/brand-pilot-content-proposal-worker
  BRAND_INTELLIGENCE_WORKER_IMAGE_NAME: ${{ github.repository_owner }}/brand-pilot-brand-intelligence-worker
  SUBJECT_ANALYSIS_WORKER_IMAGE_NAME: ${{ github.repository_owner }}/brand-pilot-subject-analysis-worker
  IMAGE_WORKER_IMAGE_NAME: ${{ github.repository_owner }}/brand-pilot-image-worker
  CARD_NEWS_WORKER_IMAGE_NAME: ${{ github.repository_owner }}/brand-pilot-card-news-worker
  BLOG_WORKER_IMAGE_NAME: ${{ github.repository_owner }}/brand-pilot-blog-worker
  MARKETING_WORKER_IMAGE_NAME: ${{ github.repository_owner }}/brand-pilot-marketing-worker

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: brand_poilot/package-lock.json

      - name: Install
        working-directory: brand_poilot
        run: npm ci

      - name: Verify
        working-directory: brand_poilot
        run: |
          npm run test:contract
          node --test scripts/migrationRunner.test.mjs
          npm run test:migrations
          npm run test --workspace @brand-pilot/api
          npm run test --workspace @brand-pilot/dm-worker
          npm run test --workspace @brand-pilot/content-proposal-worker
          npm run test --workspace @brand-pilot/brand-intelligence-worker
          npm run test --workspace @brand-pilot/subject-analysis-worker
          npm run test --workspace @brand-pilot/image-worker
          npm run test --workspace @brand-pilot/card-news-worker
          npm run test --workspace @brand-pilot/blog-worker
          npm run test --workspace @brand-pilot/marketing-worker
          npm run build --workspace @brand-pilot/api
          npm run build --workspace @brand-pilot/dm-worker
          npm run build --workspace @brand-pilot/content-proposal-worker
          npm run build --workspace @brand-pilot/brand-intelligence-worker
          npm run build --workspace @brand-pilot/subject-analysis-worker
          npm run build --workspace @brand-pilot/image-worker
          npm run build --workspace @brand-pilot/card-news-worker
          npm run build --workspace @brand-pilot/blog-worker
          npm run build --workspace @brand-pilot/marketing-worker
          shellcheck --exclude=SC1091,SC2016,SC2034,SC2317 deploy/scripts/*.sh
          npm run test:deployment

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          image="${REGISTRY}/${API_IMAGE_NAME,,}"
          dm_worker_image="${REGISTRY}/${DM_WORKER_IMAGE_NAME,,}"
          wiki_worker_image="${REGISTRY}/${WIKI_WORKER_IMAGE_NAME,,}"
          content_proposal_worker_image="${REGISTRY}/${CONTENT_PROPOSAL_WORKER_IMAGE_NAME,,}"
          brand_intelligence_worker_image="${REGISTRY}/${BRAND_INTELLIGENCE_WORKER_IMAGE_NAME,,}"
          subject_analysis_worker_image="${REGISTRY}/${SUBJECT_ANALYSIS_WORKER_IMAGE_NAME,,}"
          image_worker_image="${REGISTRY}/${IMAGE_WORKER_IMAGE_NAME,,}"
          card_news_worker_image="${REGISTRY}/${CARD_NEWS_WORKER_IMAGE_NAME,,}"
          blog_worker_image="${REGISTRY}/${BLOG_WORKER_IMAGE_NAME,,}"
          marketing_worker_image="${REGISTRY}/${MARKETING_WORKER_IMAGE_NAME,,}"
          for value in "$image" "$dm_worker_image" "$wiki_worker_image" "$content_proposal_worker_image" "$brand_intelligence_worker_image" "$subject_analysis_worker_image" "$image_worker_image" "$card_news_worker_image" "$blog_worker_image" "$marketing_worker_image"; do
            [[ "$value" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]]
          done
          printf 'name=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'dm_worker=%s\n' "$dm_worker_image" >> "$GITHUB_OUTPUT"
          printf 'wiki_worker=%s\n' "$wiki_worker_image" >> "$GITHUB_OUTPUT"
          printf 'content_proposal_worker=%s\n' "$content_proposal_worker_image" >> "$GITHUB_OUTPUT"
          printf 'brand_intelligence_worker=%s\n' "$brand_intelligence_worker_image" >> "$GITHUB_OUTPUT"
          printf 'subject_analysis_worker=%s\n' "$subject_analysis_worker_image" >> "$GITHUB_OUTPUT"
          printf 'image_worker=%s\n' "$image_worker_image" >> "$GITHUB_OUTPUT"
          printf 'card_news_worker=%s\n' "$card_news_worker_image" >> "$GITHUB_OUTPUT"
          printf 'blog_worker=%s\n' "$blog_worker_image" >> "$GITHUB_OUTPUT"
          printf 'marketing_worker=%s\n' "$marketing_worker_image" >> "$GITHUB_OUTPUT"

      - name: Build and push API
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: brand_poilot
          file: brand_poilot/apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push DM worker
        id: dm_worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: brand_poilot
          file: brand_poilot/workers/brand-pilot-dm-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.dm_worker }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Wiki worker
        id: wiki_worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: brand_poilot
          file: brand_poilot/workers/brand-pilot-dm-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.wiki_worker }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push content proposal worker
        id: content_proposal_worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: brand_poilot
          file: brand_poilot/workers/brand-pilot-content-proposal-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.content_proposal_worker }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push brand intelligence worker
        id: brand_intelligence_worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: brand_poilot
          file: brand_poilot/workers/brand-pilot-brand-intelligence-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.brand_intelligence_worker }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push subject analysis worker
        id: subject_analysis_worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: brand_poilot
          file: brand_poilot/workers/brand-pilot-subject-analysis-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.subject_analysis_worker }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push image worker
        id: image_worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: brand_poilot
          file: brand_poilot/workers/brand-pilot-image-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image_worker }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push card news worker
        id: card_news_worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: brand_poilot
          file: brand_poilot/workers/brand-pilot-card-news-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.card_news_worker }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push blog worker
        id: blog_worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: brand_poilot
          file: brand_poilot/workers/brand-pilot-blog-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.blog_worker }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push marketing worker
        id: marketing_worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: brand_poilot
          file: brand_poilot/workers/brand-pilot-marketing-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.marketing_worker }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Create release manifest
        working-directory: brand_poilot
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          API_IMAGE: ${{ steps.image.outputs.name }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          DM_WORKER_IMAGE: ${{ steps.image.outputs.dm_worker }}
          DM_WORKER_DIGEST: ${{ steps.dm_worker.outputs.digest }}
          WIKI_WORKER_IMAGE: ${{ steps.image.outputs.wiki_worker }}
          WIKI_WORKER_DIGEST: ${{ steps.wiki_worker.outputs.digest }}
          CONTENT_PROPOSAL_WORKER_IMAGE: ${{ steps.image.outputs.content_proposal_worker }}
          CONTENT_PROPOSAL_WORKER_DIGEST: ${{ steps.content_proposal_worker.outputs.digest }}
          BRAND_INTELLIGENCE_WORKER_IMAGE: ${{ steps.image.outputs.brand_intelligence_worker }}
          BRAND_INTELLIGENCE_WORKER_DIGEST: ${{ steps.brand_intelligence_worker.outputs.digest }}
          SUBJECT_ANALYSIS_WORKER_IMAGE: ${{ steps.image.outputs.subject_analysis_worker }}
          SUBJECT_ANALYSIS_WORKER_DIGEST: ${{ steps.subject_analysis_worker.outputs.digest }}
          IMAGE_WORKER_IMAGE: ${{ steps.image.outputs.image_worker }}
          IMAGE_WORKER_DIGEST: ${{ steps.image_worker.outputs.digest }}
          CARD_NEWS_WORKER_IMAGE: ${{ steps.image.outputs.card_news_worker }}
          CARD_NEWS_WORKER_DIGEST: ${{ steps.card_news_worker.outputs.digest }}
          BLOG_WORKER_IMAGE: ${{ steps.image.outputs.blog_worker }}
          BLOG_WORKER_DIGEST: ${{ steps.blog_worker.outputs.digest }}
          MARKETING_WORKER_IMAGE: ${{ steps.image.outputs.marketing_worker }}
          MARKETING_WORKER_DIGEST: ${{ steps.marketing_worker.outputs.digest }}
        run: |
          set -Eeuo pipefail
          caddy_line="$(cat deploy/caddy-image.env)"
          [[ "$(wc -l < deploy/caddy-image.env)" -eq 1 ]]
          [[ "$caddy_line" == 'CADDY_IMAGE=docker.io/library/caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648' ]]
          source deploy/caddy-image.env

          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$API_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]
          for image in "$API_IMAGE" "$DM_WORKER_IMAGE" "$WIKI_WORKER_IMAGE" "$CONTENT_PROPOSAL_WORKER_IMAGE" "$BRAND_INTELLIGENCE_WORKER_IMAGE" "$SUBJECT_ANALYSIS_WORKER_IMAGE" "$IMAGE_WORKER_IMAGE" "$CARD_NEWS_WORKER_IMAGE" "$BLOG_WORKER_IMAGE" "$MARKETING_WORKER_IMAGE"; do
            [[ "$image" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]
          done
          for digest in "$API_DIGEST" "$DM_WORKER_DIGEST" "$WIKI_WORKER_DIGEST" "$CONTENT_PROPOSAL_WORKER_DIGEST" "$BRAND_INTELLIGENCE_WORKER_DIGEST" "$SUBJECT_ANALYSIS_WORKER_DIGEST" "$IMAGE_WORKER_DIGEST" "$CARD_NEWS_WORKER_DIGEST" "$BLOG_WORKER_DIGEST" "$MARKETING_WORKER_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          [[ "$CADDY_IMAGE" =~ ^docker\.io/library/caddy@sha256:[0-9a-f]{64}$ ]]
          for value in "$RELEASE_SHA" "$API_IMAGE" "$API_DIGEST" "$DM_WORKER_IMAGE" "$DM_WORKER_DIGEST" "$WIKI_WORKER_IMAGE" "$WIKI_WORKER_DIGEST" "$CONTENT_PROPOSAL_WORKER_IMAGE" "$CONTENT_PROPOSAL_WORKER_DIGEST" "$BRAND_INTELLIGENCE_WORKER_IMAGE" "$BRAND_INTELLIGENCE_WORKER_DIGEST" "$SUBJECT_ANALYSIS_WORKER_IMAGE" "$SUBJECT_ANALYSIS_WORKER_DIGEST" "$IMAGE_WORKER_IMAGE" "$IMAGE_WORKER_DIGEST" "$CARD_NEWS_WORKER_IMAGE" "$CARD_NEWS_WORKER_DIGEST" "$BLOG_WORKER_IMAGE" "$BLOG_WORKER_DIGEST" "$MARKETING_WORKER_IMAGE" "$MARKETING_WORKER_DIGEST" "$CADDY_IMAGE"; do
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]]
          done

          {
            printf 'RELEASE_SCHEMA=1\n'
            printf 'RELEASE_SHA=%s\n' "$RELEASE_SHA"
            printf 'API_IMAGE=%s@%s\n' "$API_IMAGE" "$API_DIGEST"
            printf 'DM_WORKER_IMAGE=%s@%s\n' "$DM_WORKER_IMAGE" "$DM_WORKER_DIGEST"
            printf 'WIKI_WORKER_IMAGE=%s@%s\n' "$WIKI_WORKER_IMAGE" "$WIKI_WORKER_DIGEST"
            printf 'CONTENT_PROPOSAL_WORKER_IMAGE=%s@%s\n' "$CONTENT_PROPOSAL_WORKER_IMAGE" "$CONTENT_PROPOSAL_WORKER_DIGEST"
            printf 'BRAND_INTELLIGENCE_WORKER_IMAGE=%s@%s\n' "$BRAND_INTELLIGENCE_WORKER_IMAGE" "$BRAND_INTELLIGENCE_WORKER_DIGEST"
            printf 'SUBJECT_ANALYSIS_WORKER_IMAGE=%s@%s\n' "$SUBJECT_ANALYSIS_WORKER_IMAGE" "$SUBJECT_ANALYSIS_WORKER_DIGEST"
            printf 'IMAGE_WORKER_IMAGE=%s@%s\n' "$IMAGE_WORKER_IMAGE" "$IMAGE_WORKER_DIGEST"
            printf 'CARD_NEWS_WORKER_IMAGE=%s@%s\n' "$CARD_NEWS_WORKER_IMAGE" "$CARD_NEWS_WORKER_DIGEST"
            printf 'BLOG_WORKER_IMAGE=%s@%s\n' "$BLOG_WORKER_IMAGE" "$BLOG_WORKER_DIGEST"
            printf 'MARKETING_WORKER_IMAGE=%s@%s\n' "$MARKETING_WORKER_IMAGE" "$MARKETING_WORKER_DIGEST"
            printf 'CADDY_IMAGE=%s\n' "$CADDY_IMAGE"
            printf 'CANARY_HOST=canary-api.danbammsg.co.kr\n'
            printf 'PRIMARY_HOST=api.danbammsg.co.kr\n'
            printf 'ACME_EMAIL=ops@danbammsg.co.kr\n'
            printf 'API_ENV_FILE=/opt/brand-pilot/shared/env/api.env\n'
          } > release.env
          sha256sum release.env > release.env.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brand-pilot-api-release-${{ github.sha }}
          path: |
            brand_poilot/release.env
            brand_poilot/release.env.sha256
          if-no-files-found: error
          retention-days: 30
